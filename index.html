function telaGeral() {
  const todas = contasVisiveis().map(resumoConta);
  const rs = geralFiltrado();
  const tiposPresentes = [...new Set([].concat(...todas.map(r => r.alertas.map(x => x.tipo))))];
  const ativo = filtroGeralAtivo();
  const nFiltros = [fGeral.busca, fGeral.de, fGeral.ate].filter(Boolean).length +
    (fGeral.situacao !== "todas" ? 1 : 0) + (fGeral.movimento !== "todos" ? 1 : 0) +
    (fGeral.ocorrencia !== "todas" ? 1 : 0);

  /* --------- agregação do conjunto filtrado --------- */
  const campos = ["entradas","saidas","cashIn","qtdCashIn","estornado","qtdEstorno",
                  "cashOut","qtdCashOut","cashOutLiquido","tarifaQtd","tarifaTotal",
                  "taxaQtd","taxaTotal","manutencao","custo"];
  const T = {saldo:0, lanc:0, grupos:0, parados:0, valorParado:0,
             semTarifa:0, devida:0, orfas:0, maiorSaida:0, fecham:0, comMov:0, alertas:[]};
  campos.forEach(k => T[k] = 0);
  const todosLanc = [];
  rs.forEach(r => {
    campos.forEach(k => T[k] += r[k] || 0);
    if (r.saldo !== null) T.saldo += r.saldo;
    T.lanc += r.lanc.length; T.grupos += r.gruposEstorno || 0;
    T.parados += r.parados || 0; T.valorParado += r.valorParado || 0;
    T.semTarifa += r.semTarifaQtd || 0; T.devida += r.tarifaDevida || 0; T.orfas += r.orfas || 0;
    T.maiorSaida = Math.max(T.maiorSaida, r.maiorSaida || 0);
    if (r.fecha) T.fecham++;
    if (r.lanc.length) T.comMov++;
    T.alertas = T.alertas.concat(r.alertas);
    todosLanc.push(...r.lanc);
  });
  const graves = T.alertas.filter(a => a.nivel === "grave").length;
  const custo = +T.custo.toFixed(2);
  const pctCusto = T.cashIn ? (custo / T.cashIn * 100) : 0;
  const ticket = T.qtdCashOut ? T.cashOut / T.qtdCashOut : 0;
  const totalFluxo = T.cashIn + T.cashOut || 1;
  const comExtrato = rs.filter(r => r.a).length;

  /* --------- filtros, recolhidos por padrão --------- */
  let html = `<div class="filtro-barra">
    <button class="toggle-filtros" id="btn-filtros" aria-expanded="${filtrosGeralAbertos}">
      <span class="seta">▶</span> Filtros e busca
      ${nFiltros ? `<span class="qtd">${nFiltros}</span>` : ""}
    </button>
    ${ativo ? `<button class="limpar" data-limpar="geral">Limpar filtros</button>
      <span class="resultado" style="margin:0"><b>${rs.length}</b> de ${todas.length} contas</span>` : ""}
  </div>

  <div class="filtros" id="filtros-geral" ${filtrosGeralAbertos ? "" : "hidden"}>
    <label style="flex:2 1 220px">Buscar conta
      <input id="g-busca" type="search" placeholder="número, apelido, CNPJ ou titular"
             value="${esc(fGeral.busca)}" autocomplete="off">
    </label>
    <label>De <input id="g-de" type="date" value="${fGeral.de}"></label>
    <label>Até <input id="g-ate" type="date" value="${fGeral.ate}"></label>
    <label>Situação
      <select id="g-situacao">
        <option value="todas">Todas as contas</option>
        <option value="conciliadas" ${fGeral.situacao==="conciliadas"?"selected":""}>Com extrato conferido</option>
        <option value="sem-extrato" ${fGeral.situacao==="sem-extrato"?"selected":""}>Sem extrato carregado</option>
      </select>
    </label>
    <label>Movimento
      <select id="g-movimento">
        <option value="todos">Qualquer movimento</option>
        <option value="com" ${fGeral.movimento==="com"?"selected":""}>Com lançamentos</option>
        <option value="sem" ${fGeral.movimento==="sem"?"selected":""}>Sem lançamentos</option>
        <option value="entradas" ${fGeral.movimento==="entradas"?"selected":""}>Com entradas</option>
        <option value="saidas" ${fGeral.movimento==="saidas"?"selected":""}>Com saídas</option>
        <option value="tarifas" ${fGeral.movimento==="tarifas"?"selected":""}>Com tarifa cobrada</option>
      </select>
    </label>
  </div>`;

  /* --------- painel principal --------- */
  html += `
    <div class="fluxo">
      <div class="rotulo">Cash in do período — ${T.qtdCashIn} recebimento(s) em ${T.lanc.toLocaleString("pt-BR")} transações</div>
      <div class="saldo num">${brl(T.cashIn)}</div>
      <div class="barra">
        <i class="e" style="width:${(T.cashIn/totalFluxo*100).toFixed(1)}%"></i>
        <i class="s" style="width:${(T.cashOut/totalFluxo*100).toFixed(1)}%"></i>
      </div>
      <div class="legenda">
        <div><span class="k"><span class="swatch" style="background:var(--in)"></span>Cash in</span>
             <span class="v num">${brl(T.cashIn)}</span></div>
        <div><span class="k"><span class="swatch" style="background:var(--out)"></span>Cash out (${T.qtdCashOut})</span>
             <span class="v num">${brl(T.cashOut)}</span></div>
        <div><span class="k">Cash out líquido</span>
             <span class="v num">${brl(T.cashOutLiquido)}</span></div>
      </div>
      <div class="resultado" style="margin:10px 0 0">
        Estorno não entra no cash in: <b>${brl(T.estornado)}</b> em ${T.qtdEstorno} crédito(s) são
        pagamentos que voltaram. Saldo somado das contas: <b>${brl(T.saldo)}</b>.
      </div>
    </div>`;

  html += `<div class="bloco-titulo">Cobertura</div>
    <div class="grade compacta">
      <div class="cartao"><div class="k">Contas no painel</div><div class="v num">${rs.length} de ${BASE.contasPrevistas}</div>
        <div class="sub">${BASE.contasPrevistas - comExtrato} ainda sem extrato</div></div>
      <div class="cartao"><div class="k">Com movimento</div><div class="v num">${T.comMov}</div>
        <div class="sub">${comExtrato - T.comMov} zeradas no período</div></div>
      <div class="cartao"><div class="k">Lançamentos</div><div class="v num">${T.lanc.toLocaleString("pt-BR")}</div></div>
      <div class="cartao"><div class="k">Extratos conferidos</div><div class="v num">${T.fecham} de ${comExtrato}</div>
        <div class="sub">movimentação bate com o saldo</div></div>
    </div>

    <div class="bloco-titulo">Custo bancário</div>
    <div class="grade compacta">
      <div class="cartao"><div class="k">Tarifas</div><div class="v num">${brl(T.tarifaTotal)}</div>
        <div class="sub">${T.tarifaQtd} cobrança(s)</div></div>
      <div class="cartao"><div class="k">Taxa de entrada</div><div class="v num">${brl(T.taxaTotal)}</div>
        <div class="sub">${T.taxaQtd} cobrança(s)</div></div>
      <div class="cartao"><div class="k">Custo total</div><div class="v num">${brl(custo)}</div>
        <div class="sub">${pctCusto.toFixed(3).replace(".", ",")}% do cash in${T.manutencao ? " · inclui " + brl(T.manutencao) + " de manutenção" : ""}</div></div>
      <div class="cartao"><div class="k">Custo por operação</div>
        <div class="v num">${brl(T.tarifaQtd ? T.tarifaTotal / T.tarifaQtd : 0)}</div>
        <div class="sub">média por transferência</div></div>
    </div>

    <div class="bloco-titulo">Perfil da movimentação</div>
    <div class="grade compacta">
      <div class="cartao"><div class="k">Ticket médio de saída</div><div class="v num">${brl(ticket)}</div>
        <div class="sub">${T.qtdCashOut} pagamento(s)</div></div>
      <div class="cartao"><div class="k">Maior pagamento</div><div class="v num">${brl(T.maiorSaida)}</div></div>
      <div class="cartao"><div class="k">Dias com movimento</div>
        <div class="v num">${new Set(todosLanc.map(l => l.data)).size}</div></div>
      <div class="cartao"><div class="k">Reprocessados</div><div class="v num">${brl(T.estornado)}</div>
        <div class="sub">${T.qtdEstorno} crédito(s) de devolução</div></div>
    </div>`;

  /* --------- gráficos --------- */
  html += `<div class="bloco-titulo">Visão gráfica</div>
    <div class="grafico">
      <h3>Movimentação por dia</h3>
      <p class="sub">Entradas acima da linha, saídas abaixo. Toque numa barra para ver o valor.</p>
      ${graficoDiario(todosLanc)}
    </div>
    <div class="grafico">
      <h3>Para onde vai o dinheiro</h3>
      <p class="sub">Composição das saídas operacionais por modalidade.</p>
      ${graficoModalidades(todosLanc)}
    </div>
    <div class="grafico">
      <h3>Evolução mês a mês</h3>
      <p class="sub">Entradas, saídas e saldo em cada competência carregada.</p>
      ${graficoEvolucao()}
    </div>`;

  /* --------- avisos --------- */
  if (!ativo && todas.length < BASE.contasPrevistas) {
    html += `<div class="aviso">O painel tem <b>${todas.length}</b> das ${BASE.contasPrevistas} contas da estrutura.
      Os totais acima consideram apenas essas.</div>`;
  }
  html += avisoCortes();
  if (rs.some(r => r.a && r.a.emAndamento)) {
    const per = (rs.find(r => r.a && r.a.emAndamento).a.periodo);
    html += `<div class="aviso"><b>Competência em andamento.</b> ${rotuloComp(comp)} cobre ${esc(per)}.
      Os totais crescem até o fim do mês; para comparar com ${rotuloComp(BASE.competencias[0])},
      use a aba Comparativo, que traz a média diária.</div>`;
  }
  if (fGeral.de || fGeral.ate) {
    html += `<div class="aviso">Com recorte de datas, entradas, saídas e tarifas valem só para o intervalo.
      A conciliação de saldo e o ciclo de estornos continuam apurados sobre o mês fechado.</div>`;
  }
  /* --------- tabela --------- */
  html += `<h2 class="secao">Contas em ${rotuloComp(comp)}</h2>
    <div class="tabela-wrap"><table class="cartoes">
      <thead><tr>
        <th>Conta</th><th class="n">Lanç.</th><th class="n">Cash in</th><th class="n">Cash out</th>
        <th class="n">Tarifas</th><th class="n">Taxa de entrada</th><th class="n">Saldo</th>
      </tr></thead><tbody>`;

  if (!rs.length) {
    html += `<tr><td colspan="7"><div class="vazio">Nenhuma conta com esses filtros.</div></td></tr>`;
  }

  rs.forEach(r => {
    const c = r.conta;
    if (!r.a) {
      html += `<tr class="clicavel" data-conta="${c.id}">
        <td><div>${esc(c.apelido)}</div><div style="font-size:12px;color:var(--ink-soft)">sem extrato</div></td>
        <td class="n" colspan="6" style="color:var(--ink-soft)">Aguardando carga</td></tr>`;
      return;
    }
    html += `<tr class="clicavel" data-conta="${c.id}">
      <td><div>${esc(c.apelido)}</div>
        <div style="font-size:12px;color:var(--ink-soft)">${esc(c.conta)}</div></td>
      <td data-r="Lanç." class="n">${r.lanc.length || "—"}</td>
      <td data-r="Cash in" class="n entrada">${r.cashIn ? brl(r.cashIn) : "—"}</td>
      <td data-r="Cash out" class="n">${r.cashOut ? brl(r.cashOut) : "—"}</td>
      <td data-r="Tarifas" class="n">${r.tarifaQtd
        ? `${r.tarifaQtd}<div style="font-size:12px;color:var(--ink-soft)">${brl(r.tarifaTotal)}</div>` : "—"}</td>
      <td data-r="Taxa de entrada" class="n">${r.taxaQtd
        ? `${brl(r.taxaTotal)}<div style="font-size:12px;color:var(--ink-soft)">${r.taxaQtd} cobrança(s)</div>` : "—"}</td>
      <td data-r="Saldo" class="n">${r.saldo === null ? "—" : brl(r.saldo)}</td>
    </tr>`;
  });

  if (rs.some(r => r.a)) {
    html += `<tr style="border-top:1px solid var(--rule-strong)">
      <td><b>Total</b></td>
      <td data-r="Lanç." class="n"><b>${T.lanc}</b></td>
      <td data-r="Cash in" class="n entrada"><b>${brl(T.cashIn)}</b></td>
      <td data-r="Cash out" class="n"><b>${brl(T.cashOut)}</b></td>
      <td data-r="Tarifas" class="n"><b>${T.tarifaQtd}</b><div style="font-size:12px;color:var(--ink-soft)">${brl(T.tarifaTotal)}</div></td>
      <td data-r="Taxa de entrada" class="n"><b>${brl(T.taxaTotal)}</b><div style="font-size:12px;color:var(--ink-soft)">${T.taxaQtd} cobrança(s)</div></td>
      <td data-r="Saldo" class="n"><b>${brl(T.saldo)}</b></td>
    </tr>`;
  }

  return html + `</tbody></table></div>`;
}

function filtrarLinhas(linhas) {
  const termo = fConta.busca;
  const min = fConta.min === "" ? null : parseFloat(fConta.min);
  const max = fConta.max === "" ? null : parseFloat(fConta.max);
  return linhas.filter(({l, marca}) => {
    if (!dentroDoPeriodo(l, fConta.de, fConta.ate)) return false;
    if (fConta.natureza === "entradas" && l.valor < 0) return false;
    if (fConta.natureza === "saidas" && l.valor >= 0) return false;
    if (fConta.categoria !== "todas" && categoriaDe(l) !== fConta.categoria) return false;
    if (fConta.ocorrencia === "qualquer" && !marca.length) return false;
    if (fConta.ocorrencia === "limpos" && marca.length) return false;
    if (fConta.ocorrencia !== "todas" && fConta.ocorrencia !== "qualquer" && fConta.ocorrencia !== "limpos"
        && !marca.some(m => m.id === fConta.ocorrencia)) return false;
    const abs = Math.abs(l.valor);
    if (min !== null && !isNaN(min) && abs < min) return false;
    if (max !== null && !isNaN(max) && abs > max) return false;
    if (!casaBusca(termo, l.nome, l.transacao, l.doc || "", l.data,
                   Math.abs(l.valor).toFixed(2), brl(l.valor))) return false;
    return true;
  });
}

function telaConta(id) {
  const c = BASE.contas.find(x => x.id === id);
  const a = analisar(c, comp);

  let html = `<button class="voltar" data-voltar>← Voltar ao consolidado</button>
    <div class="ficha">
      <h2>${esc(c.apelido)}</h2>
      <dl>
        <div><dt>Titular</dt><dd>${esc(c.titular)}</dd></div>
        <div><dt>CNPJ</dt><dd>${esc(c.cnpj)}</dd></div>
        <div><dt>Agência</dt><dd>${esc(c.agencia)}</dd></div>
        <div><dt>Conta</dt><dd>${esc(c.conta)}</dd></div>
        <div><dt>Instituição</dt><dd>${esc(c.instituicao)}</dd></div>
        <div><dt>Unidade</dt><dd>${esc(c.unidade)}</dd></div>
      </dl>
    </div>`;

  if (!a) {
    return html + `<div class="tabela-wrap"><div class="vazio">
      Nenhum extrato carregado para esta conta em ${rotuloComp(comp)}.</div></div>`;
  }

  const tc = somar(a.lancamentos);
  html += `<div class="grade">
      <div class="cartao"><div class="k">Saldo anterior</div><div class="v num">${brl(a.saldoAnterior)}</div></div>
      <div class="cartao"><div class="k">Cash in</div><div class="v num entrada">${brl(tc.cashIn)}</div>
        <div class="sub">${tc.qtdCashIn} recebimento(s)</div></div>
      <div class="cartao"><div class="k">Cash out</div><div class="v num">${brl(tc.cashOut)}</div>
        <div class="sub">${tc.qtdCashOut} pagamento(s)</div></div>
      <div class="cartao"><div class="k">Estorno recebido</div><div class="v num">${brl(tc.estornado)}</div>
        <div class="sub">não é cash in</div></div>
      <div class="cartao"><div class="k">Tarifas (${a.tarifas.quantidadeCobrada})</div><div class="v num">${brl(a.tarifas.cobradoTotal)}</div></div>
      <div class="cartao"><div class="k">Saldo declarado</div><div class="v num">${brl(a.saldoDeclarado)}</div></div>
      <div class="cartao"><div class="k">Estornos sem reenvio</div>
        <div class="v num" style="color:${a.ciclo.pendentes.length ? "var(--alert)" : "inherit"}">
          ${a.ciclo.pendentes.length ? a.ciclo.pendentes.length + " · " + brlCurto(a.ciclo.valorParado) : "—"}</div></div>
      <div class="cartao"><div class="k">Lançamentos com ocorrência</div>
        <div class="v num" style="color:${a.marcas.some(m => m.some(x => x.nivel === "grave")) ? "var(--alert)" : "inherit"}">
          ${a.marcas.filter(m => m.length).length} de ${a.lancamentos.length}</div></div>
    </div>`;

  /* Um único tópico, fechado, com tudo que exige leitura. Fora dele fica
     apenas a confirmação de que o extrato fecha. */
  const notas = [];
  if (a.emAndamento) {
    html += `<div class="aviso"><b>Competência em andamento.</b> Este extrato cobre ${esc(a.periodo)};
      o mês ainda não fechou.</div>`;
  }
  if (a.parcial) {
    notas.push(`<p><b>Extrato parcial.</b> Período ${esc(a.periodo)}. Com os lançamentos carregados o saldo
      chega a ${brl(a.saldoCalculado)}; o extrato declara ${brl(a.saldoDeclarado)}.</p>`);
  } else if (Math.abs(a.difSaldo) >= 0.01) {
    notas.push(`<p><b>Saldo em conferência.</b> Diferença de ${brl(a.difSaldo)} entre o calculado
      (${brl(a.saldoCalculado)}) e o declarado (${brl(a.saldoDeclarado)}).</p>`);
  } else {
    html += `<div class="aviso" style="border-left-color:var(--in)"><b>Extrato conferido.</b>
      Movimentação e saldo declarado fecham para o período ${esc(a.periodo)}.</div>`;
  }

  if (a.ciclo.grupos.length) {
    const cc = a.ciclo;
    notas.push(`<p><b>Reprocessamentos.</b> ${brl(a.estornados)} saíram e voltaram no período.
      ${cc.resolvidos.length} foram reenviados e concluídos; ${cc.pendentes.length} seguem em tratativa,
      somando ${brl(cc.valorParado)}.</p>`);
    if (cc.pendentes.length) {
      notas.push(`<div class="tabela-wrap"><table>
        <thead><tr><th>Contraparte</th><th>CNPJ / CPF</th><th class="n">Valor</th>
        <th class="n">Tentativas</th></tr></thead><tbody>` +
        cc.pendentes.map(g => `<tr><td>${esc(g.nome)}</td>
          <td class="num" style="font-size:12.5px">${esc(g.doc || "—")}</td>
          <td class="n">${brl(g.valor)}</td><td class="n">${g.saidas.length}</td></tr>`).join("") +
        `</tbody></table></div>`);
    }
  }

  if (a.alertas.length) {
    notas.push(a.alertas.map(x => cartaoAlerta(x, false)).join(""));
  }

  if (notas.length) {
    html += `<details class="marca" style="margin:0 0 18px">
      <summary style="font-size:13px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;
        background:var(--panel)">
        <span class="seta">▶</span> Pontos de atenção desta conta (${a.alertas.length + (a.ciclo.pendentes.length ? 1 : 0)})
      </summary>
      <div class="corpo" style="font-size:13.5px">${notas.join("")}</div>
    </details>`;
  }

  /* ---- lançamentos com filtros próprios ---- */
  const linhas = a.lancamentos.map((l, i) => ({l, i, marca: a.marcas[i]}));
  const todos = a.lancamentos;
  const filtrados = filtrarLinhas(linhas);
  const s = somar(filtrados.map(x => x.l));
  const ativo = filtroContaAtivo();
  const presentes = CATEGORIAS.filter(cat => todos.some(l => categoriaDe(l) === cat.id));
  const temOutros = todos.some(l => categoriaDe(l) === "outros");
  const comMarca = linhas.filter(x => x.marca.length);
  const marcasPresentes = Object.keys(MARCAS).filter(id => linhas.some(x => x.marca.some(m => m.id === id)));
  const marcadosFiltrados = filtrados.filter(x => x.marca.length).length;
  const nFiltrosConta = [fConta.busca, fConta.de, fConta.ate, fConta.min, fConta.max].filter(v => v !== "").length +
    (fConta.natureza !== "todas" ? 1 : 0) + (fConta.categoria !== "todas" ? 1 : 0) +
    (fConta.ocorrencia !== "todas" ? 1 : 0);

  html += `<h2 class="secao">Lançamentos — ${esc(a.periodo)}</h2>
    <div class="filtro-barra">
      <button class="toggle-filtros" id="btn-filtros-conta" aria-expanded="${filtrosContaAbertos}">
        <span class="seta">▶</span> Filtros e busca
        ${nFiltrosConta ? `<span class="qtd">${nFiltrosConta}</span>` : ""}
      </button>
      ${ativo ? `<button class="limpar" data-limpar="conta">Limpar filtros</button>` : ""}
    </div>
    <div class="filtros" id="filtros-conta" ${filtrosContaAbertos ? "" : "hidden"}>
      <label style="flex:2 1 220px">Buscar
        <input id="c-busca" type="search" placeholder="contraparte, CNPJ ou descrição"
               value="${esc(fConta.busca)}" autocomplete="off">
      </label>
      <label>De
        <input id="c-de" type="date" value="${fConta.de}">
      </label>
      <label>Até
        <input id="c-ate" type="date" value="${fConta.ate}">
      </label>
      <label>Natureza
        <select id="c-natureza">
          <option value="todas">Entradas e saídas</option>
          <option value="entradas" ${fConta.natureza==="entradas"?"selected":""}>Só entradas (cash in)</option>
          <option value="saidas" ${fConta.natureza==="saidas"?"selected":""}>Só saídas (cash out)</option>
        </select>
      </label>
      <label>Ocorrência
        <select id="c-ocorrencia">
          <option value="todas">Todos os lançamentos</option>
          <option value="qualquer" ${fConta.ocorrencia==="qualquer"?"selected":""}>Só com ocorrência (${comMarca.length})</option>
          <option value="limpos" ${fConta.ocorrencia==="limpos"?"selected":""}>Só sem ocorrência (${todos.length - comMarca.length})</option>
          ${marcasPresentes.map(id => {
            const n = linhas.filter(x => x.marca.some(m => m.id === id)).length;
            return `<option value="${id}" ${fConta.ocorrencia===id?"selected":""}>${MARCAS[id]} (${n})</option>`;
          }).join("")}
        </select>
      </label>
      <label>Valor mínimo
        <input id="c-min" type="number" inputmode="decimal" step="0.01" placeholder="0,00" value="${fConta.min}">
      </label>
      <label>Valor máximo
        <input id="c-max" type="number" inputmode="decimal" step="0.01" placeholder="sem limite" value="${fConta.max}">
      </label>
    </div>
    <div class="chips">
      <button data-cat="todas" aria-pressed="${fConta.categoria==="todas"}">Tudo (${todos.length})</button>
      ${presentes.map(cat => {
        const n = todos.filter(l => categoriaDe(l) === cat.id).length;
        return `<button data-cat="${cat.id}" aria-pressed="${fConta.categoria===cat.id}">${cat.rot} (${n})</button>`;
      }).join("")}
      ${temOutros ? `<button data-cat="outros" aria-pressed="${fConta.categoria==="outros"}">Outros (${todos.filter(l => categoriaDe(l)==="outros").length})</button>` : ""}
    </div>
    <div class="resultado"><b>${filtrados.length}</b> de ${todos.length} lançamentos ·
      entradas <b>${brl(s.entradas)}</b> · saídas <b>${brl(s.saidas)}</b>
      ${s.tarifaQtd ? ` · tarifas <b>${s.tarifaQtd} · ${brl(s.tarifaTotal)}</b>` : ""}
      ${marcadosFiltrados ? ` · <span class="ponto"></span> <b>${marcadosFiltrados}</b> com ocorrência` : ""}</div>`;

  html += `<div class="tabela-wrap"><table>
      <thead><tr><th style="width:18px"></th><th>Data</th><th>Contraparte</th><th>Transação</th>
      <th>Categoria</th><th class="n">Valor</th><th class="n">Saldo</th></tr></thead>
      <tbody>`;
  if (!filtrados.length) {
    html += `<tr><td colspan="7"><div class="vazio">Nenhum lançamento com esses filtros.</div></td></tr>`;
  }
  filtrados.forEach(({l, marca}) => {
    const grave = marca.some(m => m.nivel === "grave");
    const titulo = marca.map(m => m.rot + ": " + m.txt).join(" | ");
    html += `<tr class="${marca.length ? "marcada" + (grave ? "" : " atencao") : ""}">
      <td>${marca.length ? `<span class="ponto ${grave ? "" : "atencao"}" title="${esc(titulo)}"></span>` : ""}</td>
      <td class="num">${esc(l.data)}</td>
      <td>${esc(l.nome)}</td>
      <td style="color:var(--ink-soft);font-size:13px">${esc(l.transacao)}
        ${marca.length ? `<details class="marca"><summary>
            <span class="seta">▶</span>
            ${marca.map(m => `<span class="ponto ${m.nivel === "grave" ? "" : "atencao"}"></span>`).join("")}
            ${esc(marca.map(m => m.rot).join(" · "))}
          </summary><div class="corpo">${marca.map(m => `<p>${esc(m.txt)}</p>`).join("")}</div></details>` : ""}</td>
      <td><span class="tag">${rotuloCategoria(categoriaDe(l))}</span></td>
      <td class="n ${l.valor >= 0 ? 'entrada' : ''}">${brl(l.valor)}</td>
      <td class="n">${brl(l.saldo)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  return html;
}

function cartaoAlerta(x, mostrarConta = true) {
  return `<div class="alerta-item ${x.nivel === 'grave' ? 'grave' : ''} ${mostrarConta ? 'navegavel' : ''}"
    ${mostrarConta ? `data-conta="${x.contaId}" role="button" tabindex="0"` : ''}>

function telaTarifas() {
  /* Visão de custos para o cliente: quanto o banco cobrou no mês, somando
     todas as contas, de que tipo e em quais contas. Sem comparação com
     tarifário previsto — isso é tratado fora do painel. */
  const linhas = [];
  const T = {cashIn:0, taxa:0, qTaxa:0, tarifa:0, qTar:0, manut:0, qManut:0, lanc:0};
  contasVisiveis().forEach(c => {
    const a = analisar(c, comp);
    if (!a || !a.lancamentos.length) return;
    const s = somar(a.lancamentos);
    const qManut = a.lancamentos.filter(l => ehTarifa(l) && ehManutencaoTarifa(l)).length;
    const custo = +(s.taxaTotal + s.tarifaTotal + s.manutencao).toFixed(2);
    T.cashIn += s.cashIn; T.taxa += s.taxaTotal; T.qTaxa += s.taxaQtd;
    T.tarifa += s.tarifaTotal; T.qTar += s.tarifaQtd; T.manut += s.manutencao; T.qManut += qManut;
    T.lanc += a.lancamentos.length;
    if (custo > 0) linhas.push({c, s, qManut, custo});
  });
  const total = +(T.taxa + T.tarifa + T.manut).toFixed(2);
  const qTotal = T.qTaxa + T.qTar + T.qManut;
  const pct = T.cashIn ? total / T.cashIn * 100 : 0;
  const porMil = T.cashIn ? total / T.cashIn * 1000 : 0;
  const fmtPct = v => v.toFixed(2).replace(".", ",") + "%";
  linhas.sort((a, b) => b.custo - a.custo);

  if (!linhas.length) {
    return `<div class="tabela-wrap"><div class="vazio">Nenhum custo bancário em ${rotuloComp(comp)}.</div></div>`;
  }

  /* --------- número principal --------- */
  let html = `<div class="fluxo">
      <div class="rotulo">Custo bancário total em ${rotuloComp(comp)} — todas as contas</div>
      <div class="saldo num">${brl(total)}</div>
      <div class="barra">
        <i style="background:var(--asm-vinho);width:${(T.taxa/total*100).toFixed(1)}%"></i>
        <i style="background:var(--asm-ouro);width:${(T.tarifa/total*100).toFixed(1)}%"></i>
        <i style="background:var(--asm-cinza);width:${(T.manut/total*100).toFixed(1)}%"></i>
      </div>
      <div class="legenda">
        <div><span class="k"><span class="swatch" style="background:var(--asm-vinho)"></span>Taxa de entrada</span>
             <span class="v num">${brl(T.taxa)}</span></div>
        <div><span class="k"><span class="swatch" style="background:var(--asm-ouro)"></span>Tarifas de transferência</span>
             <span class="v num">${brl(T.tarifa)}</span></div>
        <div><span class="k"><span class="swatch" style="background:var(--asm-cinza)"></span>Manutenção de conta</span>
             <span class="v num">${brl(T.manut)}</span></div>
      </div>
    </div>`;

  /* --------- cards --------- */
  html += `<div class="bloco-titulo">Resumo do mês</div>
    <div class="grade compacta">
      <div class="cartao"><div class="k">Custo sobre o cash in</div><div class="v num">${fmtPct(pct)}</div>
        <div class="sub">${brl(porMil)} a cada R$ 1.000 recebidos</div></div>
      <div class="cartao"><div class="k">Cobranças no mês</div><div class="v num">${qTotal.toLocaleString("pt-BR")}</div>
        <div class="sub">em ${linhas.length} conta(s)</div></div>
      <div class="cartao"><div class="k">Cash in do mês</div><div class="v num">${brlCurto(T.cashIn)}</div>
        <div class="sub">base de cálculo da taxa</div></div>
      <div class="cartao"><div class="k">Custo médio por conta</div><div class="v num">${brl(total / linhas.length)}</div>
        <div class="sub">entre as contas com custo</div></div>
    </div>

    <div class="bloco-titulo">Por tipo de custo</div>
    <div class="grade compacta">
      <div class="cartao" style="border-top:3px solid var(--asm-vinho)"><div class="k">Taxa de entrada</div>
        <div class="v num">${brl(T.taxa)}</div>
        <div class="sub">${T.qTaxa} cobrança(s) · ${fmtPct(T.taxa/total*100)} do custo</div></div>
      <div class="cartao" style="border-top:3px solid var(--asm-ouro)"><div class="k">Tarifas de transferência</div>
        <div class="v num">${brl(T.tarifa)}</div>
        <div class="sub">${T.qTar} cobrança(s) · média ${brl(T.qTar ? T.tarifa/T.qTar : 0)}</div></div>
      <div class="cartao" style="border-top:3px solid var(--asm-cinza)"><div class="k">Manutenção de conta</div>
        <div class="v num">${brl(T.manut)}</div>
        <div class="sub">${T.qManut} cobrança(s)</div></div>
    </div>`;

  /* --------- ranking visual --------- */
  const top = linhas.slice(0, 10);
  const maxC = top[0].custo;
  html += `<div class="bloco-titulo">Onde o custo se concentra</div>
    <div class="grafico">
      <h3>Custo por conta</h3>
      <p class="sub">As ${top.length} contas com maior custo no mês. Toque para abrir a conta.</p>
      <div style="display:flex;flex-direction:column;gap:9px">` +
      top.map(x => {
        const w = v => (v / maxC * 100).toFixed(2) + "%";
        return `<div class="clicavel" data-conta="${x.c.id}" style="cursor:pointer">
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px">
            <span>${esc(x.c.apelido)}</span><b class="num">${brl(x.custo)}</b></div>
          <div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--rule)">
            <i style="display:block;width:${w(x.s.taxaTotal)};background:var(--asm-vinho)"></i>
            <i style="display:block;width:${w(x.s.tarifaTotal)};background:var(--asm-ouro)"></i>
            <i style="display:block;width:${w(x.s.manutencao)};background:var(--asm-cinza)"></i>
          </div></div>`;
      }).join("") +
      `</div>
      <div class="legenda-g">
        <span><i style="background:var(--asm-vinho)"></i>Taxa de entrada</span>
        <span><i style="background:var(--asm-ouro)"></i>Tarifas</span>
        <span><i style="background:var(--asm-cinza)"></i>Manutenção</span>
      </div>
    </div>`;

  /* --------- tabela completa --------- */
  html += `<h2 class="secao">Custos por conta em ${rotuloComp(comp)}</h2>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Conta</th><th class="n">Taxa de entrada</th><th class="n">Tarifas</th>
        <th class="n">Manutenção</th><th class="n">Total</th><th class="n">% do cash in</th></tr></thead><tbody>` +
    linhas.map(x => `<tr class="clicavel" data-conta="${x.c.id}">
        <td><div>${esc(x.c.apelido)}</div>
          <div style="font-size:12px;color:var(--ink-soft)">${esc(x.c.unidade || "")}</div></td>
        <td class="n">${x.s.taxaTotal ? brl(x.s.taxaTotal) : "—"}</td>
        <td class="n">${x.s.tarifaQtd ? `${brl(x.s.tarifaTotal)}<div style="font-size:12px;color:var(--ink-soft)">${x.s.tarifaQtd} cobrança(s)</div>` : "—"}</td>
        <td class="n">${x.s.manutencao ? brl(x.s.manutencao) : "—"}</td>
        <td class="n"><b>${brl(x.custo)}</b></td>
        <td class="n">${x.s.cashIn ? fmtPct(x.custo / x.s.cashIn * 100) : "—"}</td>
      </tr>`).join("") +
    `<tr style="border-top:1px solid var(--rule-strong)">
        <td><b>Total</b></td>
        <td class="n"><b>${brl(T.taxa)}</b></td>
        <td class="n"><b>${brl(T.tarifa)}</b></td>
        <td class="n"><b>${brl(T.manut)}</b></td>
        <td class="n"><b>${brl(total)}</b></td>
        <td class="n"><b>${fmtPct(pct)}</b></td>
      </tr></tbody></table></div>`;

  /* --------- tabela de tarifas, recolhida --------- */
  const t = BASE.tarifario;
  html += `<details class="marca" style="margin:18px 0 0">
      <summary style="font-size:13px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel)">
        <span class="seta">▶</span> Valores unitários observados nos extratos
      </summary>
      <div class="corpo" style="font-size:13px">
        <p>TED ${brl(t.itens.ted ?? 0)} · Pix ${brl(t.itens.pix ?? 0)} · Boleto ${brl(t.itens.boleto ?? 0)} ·
        Transferência interna ${brl(t.itens.tef ?? 0)} por operação. A taxa de entrada é percentual sobre
        cada crédito recebido, e a manutenção é cobrada por conta.</p>
      </div>
    </details>`;

  return html;
}

/* Busca tolerante: ignora acento, pontuação e maiúsculas, e exige que todos
   os termos digitados apareçam. */
const normaliza = s => String(s == null ? "" : s)
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[.\-/(),:]/g, " ").replace(/\s+/g, " ").trim();

function casaBusca(termo, ...campos) {
  const t = normaliza(termo);
  if (!t) return true;
  const alvo = " " + campos.map(normaliza).join(" ") + " ";
  const semEspaco = alvo.replace(/ /g, "");
  return t.split(" ").every(p => alvo.includes(p) || semEspaco.includes(p.replace(/ /g, "")));
}

/* Dias corridos que a competência cobre, lidos do próprio período do extrato.
   Em mês ainda em curso isso é o que permite comparar por média diária. */
function diasDoPeriodo(p) {
  const m = String(p).match(/(\d{2})\/(\d{2})\/(\d{4}) a (\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return null;
  const a = new Date(+m[3], +m[2] - 1, +m[1]), b = new Date(+m[6], +m[5] - 1, +m[4]);
  return Math.round((b - a) / 86400000) + 1;
}

/* Números de uma competência inteira, somando as contas visíveis. */
function resumoCompetencia(cp) {
  const R = {cp, cashIn:0, qtdCashIn:0, cashOut:0, qtdCashOut:0, estornado:0,
             tarifaTotal:0, taxaTotal:0, manutencao:0, custo:0, saldo:0, lanc:0,
             contas:0, alertas:0, graves:0, parado:0, dias:null, emAndamento:false, periodo:""};
  contasVisiveis().forEach(c => {
    const a = analisar(c, cp);
    if (!a) return;
    const s = somar(a.lancamentos);
    ["cashIn","qtdCashIn","cashOut","qtdCashOut","estornado","tarifaTotal","taxaTotal","manutencao","custo"]
      .forEach(k => R[k] += s[k]);
    R.saldo += a.saldoDeclarado; R.lanc += a.lancamentos.length;
    R.alertas += a.alertas.length; R.graves += a.alertas.filter(x => x.nivel === "grave").length;
    R.parado += a.ciclo.valorParado;
    if (a.lancamentos.length) R.contas++;
    if (!R.dias) { R.dias = diasDoPeriodo(a.periodo); R.periodo = a.periodo; }
    if (a.emAndamento) R.emAndamento = true;
  });
  R.porDia = R.dias ? R.cashIn / R.dias : null;
  R.porDiaOut = R.dias ? R.cashOut / R.dias : null;
  return R;
}

/* Variação entre dois números, já formatada. */
function variacao(atual, anterior) {
  if (!anterior) return {txt: "—", cor: "var(--ink-soft)"};
  const p = (atual - anterior) / Math.abs(anterior) * 100;
  return {txt: (p >= 0 ? "+" : "") + p.toFixed(1).replace(".", ",") + "%",
          cor: p >= 0 ? "var(--in)" : "var(--out)"};
}

function telaComparativo() {
  if (BASE.competencias.length < 2) {
    return `<div class="tabela-wrap"><div class="vazio">
      O comparativo aparece a partir da segunda competência carregada.<br>
      Hoje o painel tem apenas ${rotuloComp(BASE.competencias[0])}.</div></div>`;
  }
  const cps = BASE.competencias.slice().sort();
  const rs = cps.map(resumoCompetencia);
  /* O comparativo acompanha a competência escolhida no seletor: compara o mês
     aberto com o imediatamente anterior, não as duas últimas competências. */
  const iAtual = Math.max(0, cps.indexOf(comp));
  const atual = rs[iAtual];
  const ant = iAtual > 0 ? rs[iAtual - 1] : null;
  const parciais = atual.emAndamento ? [atual] : [];
  const comparavelPorDia = !!(ant && atual.dias && ant.dias);

  /* --------- total acumulado de tudo que está no painel --------- */
  const A = {cashIn:0, qtdCashIn:0, cashOut:0, qtdCashOut:0, estornado:0, custo:0,
             tarifaTotal:0, taxaTotal:0, manutencao:0, lanc:0, dias:0};
  rs.forEach(r => Object.keys(A).forEach(k => A[k] += r[k] || 0));
  const saldoAtual = atual.saldo;

  let html = `<div class="fluxo">
      <div class="rotulo">Total do período — ${rotuloComp(cps[0])} a ${rotuloComp(cps[cps.length-1])}
        · ${A.dias} dias · ${A.lanc.toLocaleString("pt-BR")} transações</div>
      <div class="saldo num">${brl(A.cashIn)}</div>
      <div class="barra">
        <i class="e" style="width:${(A.cashIn/(A.cashIn+A.cashOut||1)*100).toFixed(1)}%"></i>
        <i class="s" style="width:${(A.cashOut/(A.cashIn+A.cashOut||1)*100).toFixed(1)}%"></i>
      </div>
      <div class="legenda">
        <div><span class="k"><span class="swatch" style="background:var(--in)"></span>Cash in acumulado (${A.qtdCashIn})</span>
             <span class="v num">${brl(A.cashIn)}</span></div>
        <div><span class="k"><span class="swatch" style="background:var(--out)"></span>Cash out acumulado (${A.qtdCashOut})</span>
             <span class="v num">${brl(A.cashOut)}</span></div>
        <div><span class="k">Resultado acumulado</span>
             <span class="v num">${brl(A.cashIn - A.cashOut)}</span></div>
      </div>
    </div>

    <div class="grade compacta">
      <div class="cartao"><div class="k">Custo bancário do período</div><div class="v num">${brl(A.custo)}</div>
        <div class="sub">${(A.cashIn ? A.custo/A.cashIn*100 : 0).toFixed(3).replace(".", ",")}% do cash in</div></div>
      <div class="cartao"><div class="k">Taxa de entrada</div><div class="v num">${brl(A.taxaTotal)}</div>
        <div class="sub">tarifas ${brl(A.tarifaTotal)}${A.manutencao ? " · manutenção " + brl(A.manutencao) : ""}</div></div>
      <div class="cartao"><div class="k">Estorno no período</div><div class="v num">${brl(A.estornado)}</div>
        <div class="sub">não entra no cash in</div></div>
      <div class="cartao"><div class="k">Saldo ao fim de ${rotuloComp(atual.cp)}</div>
        <div class="v num">${brl(saldoAtual)}</div></div>
    </div>`;

  if (parciais.length) {
    html += `<div class="aviso"><b>Competência em andamento.</b>
      ${rotuloComp(atual.cp)} cobre ${atual.periodo}, ou seja, ${atual.dias} dias.
      Comparar os totais com um mês fechado subestima o mês em curso, por isso a
      média diária aparece ao lado de cada valor.</div>`;
  }

  /* --------- cartões de variação --------- */
  const linha = (rot, a, b, fmt = brl) => {
    if (!ant) return `<div class="cartao"><div class="k">${rot}</div>
      <div class="v num">${fmt(a)}</div>
      <div class="sub">primeira competência carregada</div></div>`;
    const v = variacao(a, b);
    return `<div class="cartao"><div class="k">${rot}</div>
      <div class="v num">${fmt(a)}</div>
      <div class="sub">${rotuloComp(ant.cp)}: ${fmt(b)} ·
        <b style="color:${v.cor}">${v.txt}</b></div></div>`;
  };
  html += `<div class="bloco-titulo">${ant ? rotuloComp(atual.cp) + " comparado com " + rotuloComp(ant.cp)
                                           : rotuloComp(atual.cp)}</div>
    <div class="grade compacta">
      ${linha("Cash in", atual.cashIn, ant && ant.cashIn)}
      ${linha("Cash out", atual.cashOut, ant && ant.cashOut)}
      ${linha("Custo bancário", atual.custo, ant && ant.custo)}
      ${linha("Transações", atual.lanc, ant && ant.lanc, n => n.toLocaleString("pt-BR"))}
    </div>`;

  if (comparavelPorDia) {
    html += `<div class="bloco-titulo">Na mesma régua — média por dia corrido</div>
      <div class="grade compacta">
        ${linha("Cash in por dia", atual.porDia, ant.porDia)}
        ${linha("Cash out por dia", atual.porDiaOut, ant.porDiaOut)}
        ${linha("Transações por dia", atual.lanc / atual.dias, ant.lanc / ant.dias,
                n => n.toFixed(1).replace(".", ","))}
        ${linha("Custo por dia", atual.custo / atual.dias, ant.custo / ant.dias)}
      </div>`;
  }

  /* --------- gráfico de barras --------- */
  const maxV = Math.max(...rs.map(r => Math.max(r.cashIn, r.cashOut)));
  const W = 720, H = 210, base = H - 26, larg = W / rs.length;
  let barras = "";
  rs.forEach((r, i) => {
    const bw = Math.min(58, larg / 3.2);
    const x = i * larg + larg / 2;
    const h1 = r.cashIn / maxV * (base - 14), h2 = r.cashOut / maxV * (base - 14);
    barras += `<rect class="barra" x="${(x - bw - 3).toFixed(1)}" y="${(base - h1).toFixed(1)}" width="${bw}" height="${h1.toFixed(1)}" rx="2" fill="var(--in)"><title>${rotuloComp(r.cp)} · cash in ${brl(r.cashIn)}</title></rect>
      <rect class="barra" x="${(x + 3).toFixed(1)}" y="${(base - h2).toFixed(1)}" width="${bw}" height="${h2.toFixed(1)}" rx="2" fill="var(--out)"><title>${rotuloComp(r.cp)} · cash out ${brl(r.cashOut)}</title></rect>
      <text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11"
        font-weight="${r.cp === atual.cp ? 600 : 400}"
        fill="${r.cp === atual.cp ? "var(--ink)" : "var(--ink-soft)"}">${rotuloComp(r.cp)}${r.emAndamento ? " *" : ""}</text>`;
  });
  html += `<div class="grafico">
      <h3>Cash in e cash out por competência</h3>
      <p class="sub">Valores totais do período de cada competência.${parciais.length ? " O asterisco marca mês em andamento." : ""}</p>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparativo por competência">
        <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--rule-strong)"/>${barras}</svg>
      <div class="legenda-g">
        <span><i style="background:var(--in)"></i>Cash in</span>
        <span><i style="background:var(--out)"></i>Cash out</span>
      </div>
    </div>`;

  /* --------- tabela por competência --------- */
  html += `<h2 class="secao">Todas as competências</h2>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Competência</th><th class="n">Dias</th><th class="n">Transações</th>
      <th class="n">Cash in</th><th class="n">Cash out</th><th class="n">Custo</th>
      <th class="n">Cash in / dia</th><th class="n">Saldo final</th></tr></thead><tbody>` +
    rs.map(r => `<tr>
      <td>${rotuloComp(r.cp)}${r.emAndamento ? ` <span class="tag">em andamento</span>` : ""}
        <div style="font-size:12px;color:var(--ink-soft)">${esc(r.periodo)}</div></td>
      <td class="n">${r.dias || "—"}</td>
      <td class="n">${r.lanc.toLocaleString("pt-BR")}</td>
      <td class="n entrada">${brl(r.cashIn)}<div style="font-size:12px;color:var(--ink-soft)">${r.qtdCashIn} recebimento(s)</div></td>
      <td class="n">${brl(r.cashOut)}<div style="font-size:12px;color:var(--ink-soft)">${r.qtdCashOut} pagamento(s)</div></td>
      <td class="n">${brl(r.custo)}</td>
      <td class="n">${r.porDia ? brl(r.porDia) : "—"}</td>
      <td class="n">${brl(r.saldo)}</td></tr>`).join("") +
    `<tr style="border-top:1px solid var(--rule-strong)">
      <td><b>Total do período</b><div style="font-size:12px;color:var(--ink-soft)">${rs.length} competência(s)</div></td>
      <td class="n"><b>${A.dias}</b></td>
      <td class="n"><b>${A.lanc.toLocaleString("pt-BR")}</b></td>
      <td class="n entrada"><b>${brl(A.cashIn)}</b><div style="font-size:12px;color:var(--ink-soft)">${A.qtdCashIn} recebimento(s)</div></td>
      <td class="n"><b>${brl(A.cashOut)}</b><div style="font-size:12px;color:var(--ink-soft)">${A.qtdCashOut} pagamento(s)</div></td>
      <td class="n"><b>${brl(A.custo)}</b></td>
      <td class="n"><b>${A.dias ? brl(A.cashIn / A.dias) : "—"}</b></td>
      <td class="n"><b>${brl(saldoAtual)}</b></td></tr>` +
    `</tbody></table></div>`;

  /* --------- variação por conta --------- */
  if (!ant) return html;

  const porConta = contasVisiveis().map(c => {
    const a1 = analisar(c, ant.cp), a2 = analisar(c, atual.cp);
    const s1 = a1 ? somar(a1.lancamentos) : null, s2 = a2 ? somar(a2.lancamentos) : null;
    return {c, ci1: s1 ? s1.cashIn : 0, ci2: s2 ? s2.cashIn : 0,
            co1: s1 ? s1.cashOut : 0, co2: s2 ? s2.cashOut : 0};
  }).filter(x => x.ci1 || x.ci2 || x.co1 || x.co2);
  porConta.sort((a, b) => Math.abs(b.ci2 - b.ci1) - Math.abs(a.ci2 - a.ci1));

  html += `<h2 class="secao">Variação por conta — ${rotuloComp(ant.cp)} para ${rotuloComp(atual.cp)}</h2>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Conta</th><th class="n">Cash in ${rotuloComp(ant.cp)}</th>
      <th class="n">Cash in ${rotuloComp(atual.cp)}</th><th class="n">Variação</th>
      <th class="n">Cash out ${rotuloComp(atual.cp)}</th></tr></thead><tbody>` +
    porConta.map(x => {
      const v = variacao(x.ci2, x.ci1);
      return `<tr class="clicavel" data-conta="${x.c.id}">
        <td><div>${esc(x.c.apelido)}</div>
          <div style="font-size:12px;color:var(--ink-soft)">${esc(x.c.unidade || "")}</div></td>
        <td class="n">${x.ci1 ? brl(x.ci1) : "—"}</td>
        <td class="n entrada">${x.ci2 ? brl(x.ci2) : "—"}</td>
        <td class="n" style="color:${v.cor}">${x.ci1 || x.ci2 ? v.txt : "—"}</td>
        <td class="n">${x.co2 ? brl(x.co2) : "—"}</td></tr>`;
    }).join("") +
    `<tr style="border-top:1px solid var(--rule-strong)">
      <td><b>Total</b></td><td class="n"><b>${brl(ant.cashIn)}</b></td>
      <td class="n entrada"><b>${brl(atual.cashIn)}</b></td>
      <td class="n" style="color:${variacao(atual.cashIn, ant.cashIn).cor}"><b>${variacao(atual.cashIn, ant.cashIn).txt}</b></td>
      <td class="n"><b>${brl(atual.cashOut)}</b></td></tr>
    </tbody></table></div>`;
  return html;
}

/* ===================== render ===================== */
function renderAbas() {
  const k = consolidado();
  const itens = [
    ["resumo", "Resumo", 0],
    ["geral", "Consolidado", 0],
    ["tarifas", "Custos", 0],
    ["comparativo", "Comparativo", 0]
  ];
  document.getElementById("abas").innerHTML = itens.map(([id, rot, n]) =>
    `<button data-aba="${id}" aria-selected="${aba === id && !contaAberta}">${rot}${n ? `<span class="contador">${n}</span>` : ''}</button>`
  ).join("");
}

function renderLista() {
  const termo = (document.getElementById("busca").value || "").toLowerCase();
  const itens = contasVisiveis().filter(c =>
    !termo || (c.apelido + c.conta + c.cnpj + c.titular).toLowerCase().includes(termo));
  document.getElementById("lista-contas").innerHTML = itens.length ? itens.map(c => {
    const a = analisar(c, comp);
    const cls = !a ? "" : (a.alertas.some(x => x.nivel === "grave") ? "alerta" : "ok");
    const sub = a ? brl(a.saldoDeclarado) : "sem extrato";
    return `<button class="item-conta" data-conta="${c.id}">
      <span class="rot"><span class="pin ${cls}"></span>${esc(c.apelido)}</span>
      <span class="sub">${sub}</span>
    </button>`;
  }).join("") : `<div class="vazio">Nenhuma conta encontrada.</div>`;
}

/* Liga os campos de filtro que acabaram de ser desenhados na tela. Campos de
   texto pedem re-render a cada tecla, então marcamos qual deve ficar com o
   cursor para o foco não se perder. */
function ligarFiltros() {
  const liga = (id, alvo, prop, texto) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener(texto ? "input" : "change", e => {
      alvo[prop] = e.target.value;
      if (texto) focoAtivo = id;
      render();
    });
  };
  liga("g-busca", fGeral, "busca", true);
  liga("g-de", fGeral, "de", false);
  liga("g-ate", fGeral, "ate", false);
  liga("g-situacao", fGeral, "situacao", false);
  liga("g-movimento", fGeral, "movimento", false);
  liga("g-ocorrencia", fGeral, "ocorrencia", false);

  liga("c-busca", fConta, "busca", true);
  liga("c-de", fConta, "de", false);
  liga("c-ate", fConta, "ate", false);
  liga("c-natureza", fConta, "natureza", false);
  liga("c-ocorrencia", fConta, "ocorrencia", false);
  liga("c-min", fConta, "min", true);
  liga("c-max", fConta, "max", true);

  const fc = document.getElementById("f-conta"), ft = document.getElementById("f-tipo");
  if (fc) fc.addEventListener("change", e => { filtroConta = e.target.value; render(); });
  if (ft) ft.addEventListener("change", e => { filtroTipo = e.target.value; render(); });
}

/* ---------- endereço que guarda onde você está ----------
   O fim do endereço passa a registrar a aba (ou a conta) e a competência, para
   o link abrir direto no ponto certo e o botão voltar funcionar. A conta é
   identificada por um número de posição, não pelo número da conta bancária. */
const ABAS_VALIDAS = ["resumo", "geral", "tarifas", "comparativo"];

function hashAtual() {
  if (!BASE) return "";
  const i = contaAberta ? BASE.contas.findIndex(c => c.id === contaAberta) : -1;
  return "#" + (i >= 0 ? "c" + i : aba) + "@" + comp;
}

function aplicarHash() {
  if (!BASE || !location.hash) return false;
  const [parte, cp] = decodeURIComponent(location.hash.slice(1)).split("@");
  if (cp && BASE.competencias.includes(cp)) comp = cp;
  const m = /^c(\d+)$/.exec(parte);
  if (m && BASE.contas[+m[1]]) { contaAberta = BASE.contas[+m[1]].id; return true; }
  if (ABAS_VALIDAS.includes(parte)) { aba = parte; contaAberta = null; return true; }
  return false;
}

function sincronizarHash() {
  const h = hashAtual();
  if (h && location.hash !== h) location.hash = h;
}

window.addEventListener("hashchange", () => {
  if (!BASE || location.hash === hashAtual()) return;
  if (aplicarHash()) {
    const sel = document.getElementById("sel-comp");
    if (sel) sel.value = comp;
    render();
  }
});

/* Conta os números de zero até o valor exibido, uma vez por tela aberta.
   Lê o texto já formatado, anima a parte numérica e repõe o texto original no
   fim, para não haver risco de arredondar diferente do que o painel calculou. */
let telaAnterior = null;
function animarNumeros() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const alvos = document.querySelectorAll(
    "#tela .regua-heroi, #tela .faixa-ind .v, #tela .cartao .v, #tela .fluxo .saldo, #tela .painel .grande");
  alvos.forEach((el, i) => {
    const original = el.textContent;
    const m = original.match(/-?\d[\d.]*(,\d+)?/);
    if (!m) return;
    const bruto = m[0];
    const destino = parseFloat(bruto.replace(/\./g, "").replace(",", "."));
    if (!isFinite(destino) || Math.abs(destino) < 2) return;
    const casas = bruto.includes(",") ? bruto.split(",")[1].length : 0;
    const antes = original.slice(0, m.index), depois = original.slice(m.index + bruto.length);
    const dur = 620 + Math.min(i, 6) * 50, ini = performance.now();
    const passo = t => {
      const p = Math.min(1, (t - ini) / dur);
      const v = destino * (1 - Math.pow(1 - p, 3));
      el.textContent = antes + v.toLocaleString("pt-BR",
        {minimumFractionDigits: casas, maximumFractionDigits: casas}) + depois;
      if (p < 1) requestAnimationFrame(passo); else el.textContent = original;
    };
    requestAnimationFrame(passo);
  });
}

function render() {
  renderAbas();
  renderLista();
  const tela = document.getElementById("tela");
  if (contaAberta) {
    tela.innerHTML = telaConta(contaAberta);
    document.getElementById("titulo-topo").textContent = BASE.contas.find(c => c.id === contaAberta).apelido;
  } else {
    tela.innerHTML = aba === "resumo" ? telaResumo()
                   : aba === "geral" ? telaGeral()
                   : aba === "tarifas" ? telaTarifas()
                   : telaComparativo();
    document.getElementById("titulo-topo").textContent = BASE.organizacao;
  }
  /* A competência governa o Consolidado, os Custos e a tela da conta. No Resumo
     os meses aparecem lado a lado, então o seletor ali não muda nada e some. */
  const sel = document.getElementById("sel-comp");
  if (sel) sel.style.display = (!contaAberta && aba === "resumo") ? "none" : "";

  ligarFiltros();
  document.getElementById("rodape").innerHTML =
    `<div class="rodape-marca">
       <b>ASSOCIAÇÃO SAÚDE EM MOVIMENTO</b>
       <span>CNPJ 27.324.279/0001-15 · Existimos para cuidar</span>
     </div>
     <div>Documento de uso restrito. Acesso: ${esc(ACESSO ? ACESSO.nome : "—")} · ${rotuloComp(comp)}.</div>
     <div>Extratos atualizados até ${esc(dataDeReferencia())}.</div>`;

  sincronizarHash();

  const telaAtual = contaAberta ? "conta:" + contaAberta + ":" + comp : "aba:" + aba + ":" + comp;
  if (telaAtual !== telaAnterior) { telaAnterior = telaAtual; animarNumeros(); }

  const manter = focoAtivo;
  focoAtivo = null;
  if (manter) {
    const el = document.getElementById(manter);
    if (el) {
      el.focus();
      try { const v = el.value; el.setSelectionRange(v.length, v.length); } catch (_) {}
    }
  } else {
    window.scrollTo({top: 0, behavior: "instant"});
  }
}

/* ===================== eventos ===================== */
function abrirGaveta(v) {
  document.getElementById("gaveta").classList.toggle("aberta", v);
  document.getElementById("veu").classList.toggle("aberta", v);
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrirCofre(codigo) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(codigo), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(COFRE.salt), iterations: COFRE.it, hash: "SHA-256"},
    material, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(COFRE.iv)}, chave, b64(COFRE.dados));
  if (!COFRE.gzip) return JSON.parse(new TextDecoder().decode(claro));
  const fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(fluxo).text());
}

document.getElementById("entrar").addEventListener("click", async () => {
  const btn = document.getElementById("entrar");
  const erro = document.getElementById("erro");
  const cod = document.getElementById("codigo").value.trim().toUpperCase();
  erro.textContent = "";
  if (!cod) return;
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    erro.textContent = "Este navegador é antigo demais para abrir o painel. " +
      "Atualize o Safari, Chrome ou Edge, ou abra o link em outro aparelho.";
    return;
  }
  btn.disabled = true;
  const rotulo = btn.textContent;
  btn.textContent = "Verificando…";
  try { BASE = await abrirCofre(cod); }
  catch (_) {
    erro.textContent = "Código não reconhecido. Confira o código enviado a você.";
    btn.disabled = false; btn.textContent = rotulo; return;
  }
  comp = BASE.competencias[BASE.competencias.length - 1];
  ACESSO = {nome: "Painel de acompanhamento", contas: "todas"};
  revelarPainel();
  const sel = document.getElementById("sel-comp");
  sel.innerHTML = BASE.competencias.map(c => `<option value="${c}">${rotuloComp(c)}</option>`).join("");
  sel.value = comp;
  if (aplicarHash()) sel.value = comp;
  render();
});
document.getElementById("codigo").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("entrar").click();
});

/* Mostra o painel com a abertura do escudo. Chamada depois que o código é
   aceito, tanto na versão aberta quanto na cifrada. */
function revelarPainel() {
  const porta = document.getElementById("porta");
  const app = document.getElementById("app");
  const abertura = document.getElementById("abertura");
  const fonte = document.querySelector(".porta-logo") || document.querySelector(".topo-logo");
  const semMovimento = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  porta.style.display = "none";
  app.style.display = "block";

  if (abertura && fonte && !semMovimento) {
    const i = document.createElement("img");
    i.src = fonte.src; i.alt = "";
    abertura.innerHTML = "";
    abertura.appendChild(i);
    abertura.hidden = false;
    app.classList.add("entrando");
    setTimeout(() => {
      abertura.hidden = true;
      abertura.innerHTML = "";
      app.classList.remove("entrando");
    }, 1800);
  }
}

/* Tema: escuro por padrão, escolha lembrada neste navegador. */
function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  const b = document.getElementById("btn-tema");
  if (b) { b.textContent = t === "claro" ? "☀" : "☾";
           b.setAttribute("aria-pressed", String(t === "claro")); }
  try { localStorage.setItem("asm-tema", t); } catch (_) {}
}
(function () {
  let t = "escuro";
  try { if (localStorage.getItem("asm-tema") === "claro") t = "claro"; } catch (_) {}
  aplicarTema(t);
  const b = document.getElementById("btn-tema");
  if (b) b.addEventListener("click", () =>
    aplicarTema(document.documentElement.dataset.tema === "claro" ? "escuro" : "claro"));
})();

/* reaproveita o logo já embutido, sem duplicar a imagem no arquivo */
(function () {
  const fonte = document.querySelector(".topo-logo") || document.querySelector(".porta-logo");
  const alvo = document.getElementById("marca-dagua");
  if (fonte && alvo) { const i = document.createElement("img"); i.src = fonte.src; i.alt = ""; alvo.appendChild(i); }
})();

document.getElementById("abrir-gaveta").addEventListener("click", () => abrirGaveta(true));
document.getElementById("fechar-gaveta").addEventListener("click", () => abrirGaveta(false));
document.getElementById("veu").addEventListener("click", () => abrirGaveta(false));
document.getElementById("busca").addEventListener("input", renderLista);

document.getElementById("sel-comp").addEventListener("change", e => { comp = e.target.value; render(); });

document.getElementById("abas").addEventListener("click", e => {
  const b = e.target.closest("[data-aba]");
  if (!b) return;
  aba = b.dataset.aba; contaAberta = null; render();
});

document.addEventListener("click", e => {
  const det = e.target.closest("[data-modal]");
  if (det) { abrirModal(det.dataset.modal); return; }
  if (e.target.closest("[data-fechar-modal]") || e.target.id === "overlay") { fecharModal(); return; }

  const limpar = e.target.closest("[data-limpar]");
  if (limpar) {
    if (limpar.dataset.limpar === "geral")
      fGeral = {busca:"", de:"", ate:"", situacao:"todas", movimento:"todos", ocorrencia:"todas"};
    else
      fConta = {busca:"", de:"", ate:"", natureza:"todas", categoria:"todas", ocorrencia:"todas", min:"", max:""};
    render();
    return;
  }
  if (e.target.closest("[data-imprimir]")) { window.print(); return; }
  if (e.target.closest("#btn-filtros")) { filtrosGeralAbertos = !filtrosGeralAbertos; render(); return; }
  if (e.target.closest("#btn-filtros-conta")) { filtrosContaAbertos = !filtrosContaAbertos; render(); return; }

  const chip = e.target.closest("[data-cat]");
  if (chip) { fConta.categoria = chip.dataset.cat; render(); return; }

  const alvo = e.target.closest("[data-conta]");
  if (alvo) {
    if (contaAberta !== alvo.dataset.conta)
      fConta = {busca:"", de:"", ate:"", natureza:"todas", categoria:"todas", ocorrencia:"todas", min:"", max:""};
    contaAberta = alvo.dataset.conta; abrirGaveta(false); render(); return;
  }
  if (e.target.closest("[data-voltar]")) { contaAberta = null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("overlay").hidden) { fecharModal(); return; }
  if (e.key === "Escape") abrirGaveta(false);
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("navegavel")) {
    e.preventDefault();
    contaAberta = e.target.dataset.conta; render();
  }
});
