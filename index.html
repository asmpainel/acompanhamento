<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Associação Saúde em Movimento">
<meta property="og:title" content="Acompanhamento financeiro — ASM">
<meta property="og:description" content="Painel de movimentação das contas da Associação Saúde em Movimento. Acesso restrito por código.">
<meta property="og:url" content="https://asmpainel.github.io/acompanhamento/">
<meta property="og:image" content="https://asmpainel.github.io/acompanhamento/logo-asm.png">
<meta property="og:image:width" content="747">
<meta property="og:image:height" content="959">
<meta property="og:image:alt" content="Escudo da Associação Saúde em Movimento">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#14100F">
<meta name="description" content="Painel de movimentação das contas da ASM. Acesso restrito por código.">
<title>Conciliação financeira — Associação Saúde em Movimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* marca ASM — extraída do escudo e do site institucional */
  --asm-vinho:#8E332B;
  --asm-vermelho:#C42E24;
  --asm-ouro:#C6A35A;
  --asm-cinza:#8D8D8D;

  --paper:#F6F4F3;
  --panel:#FFFFFF;
  --ink:#1E1715;
  --ink-soft:#6B5F5C;
  --rule:#E4DEDC;
  --rule-strong:#CBC1BE;
  --in:#1F6F5C;
  --out:#4A4340;
  --alert:#C0392B;
  --warn:#A87513;
  --focus:#8E332B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141110;
    --panel:#1C1817;
    --ink:#EFE9E7;
    --ink-soft:#A4948F;
    --rule:#2C2624;
    --rule-strong:#3D3532;
    --in:#5FBFA3;
    --out:#BCAFAA;
    --alert:#E8756A;
    --warn:#D8B25C;
    --focus:#D9A08F;
  }
}
:root[data-theme="dark"]{
  --paper:#141110;
  --panel:#1C1817;
  --ink:#EFE9E7;
  --ink-soft:#A4948F;
  --rule:#2C2624;
  --rule-strong:#3D3532;
  --in:#5FBFA3;
  --out:#BCAFAA;
  --alert:#E8756A;
  --warn:#D8B25C;
  --focus:#D9A08F;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- identidade ASM ---------- */
/* filete institucional: vinho, cinza e ouro, como na faixa do site */
.filete{height:3px;display:flex;flex:0 0 auto}
.filete i{display:block;height:100%;flex:1}
.filete i:nth-child(1){background:var(--asm-vinho)}
.filete i:nth-child(2){background:var(--asm-cinza)}
.filete i:nth-child(3){background:var(--asm-ouro)}

.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{display:block;height:34px;width:auto;flex:0 0 auto}
.marca .nome{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.marca .nome b{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--asm-vinho)}
.marca .nome span{font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}

/* ---------- porta de entrada ---------- */
#porta{
  position:fixed;inset:0;background:var(--paper);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.porta-card{width:100%;max-width:380px;text-align:center}
.porta-card .campo{text-align:left}
.porta-logo{display:block;height:104px;width:auto;margin:0 auto 14px}
.porta-org b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.09em;color:var(--asm-vinho)}
.porta-org span{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.05em;margin-top:2px}
.porta-org{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.porta-card h1{font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:-0.02em}
.porta-card p{color:var(--ink-soft);margin:0 0 24px;font-size:14px}
.campo{display:flex;flex-direction:column;gap:8px}
.campo label{font-size:13px;color:var(--ink-soft)}
.campo input{
  font:inherit;padding:12px 14px;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:6px;letter-spacing:0.06em;text-transform:uppercase;
}
.btn{
  margin-top:14px;padding:12px 16px;width:100%;
  background:var(--asm-vinho);color:#FFF;border-radius:6px;font-weight:500;
}
.btn:hover{background:#7A2B24}
.erro{color:var(--alert);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- moldura ---------- */
#app{display:none}
header.topo{
  position:sticky;top:0;z-index:30;background:var(--paper);
  display:flex;align-items:center;gap:12px;padding:12px 16px;
}
.topo-logo{display:block;height:26px;width:auto;flex:0 0 auto}
.filete{position:sticky;top:50px;z-index:29}
.menu-btn{display:flex;flex-direction:column;gap:4px;padding:6px;margin:-6px}
.menu-btn span{display:block;width:18px;height:1.5px;background:var(--ink)}
.topo h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-0.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.comp{
  font:inherit;font-size:13px;padding:6px 8px;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:5px;
}
main{padding:20px 16px 64px;max-width:1080px;margin:0 auto}

nav.abas{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:24px;overflow-x:auto}
nav.abas button{
  padding:10px 12px;font-size:14px;color:var(--ink-soft);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.abas button[aria-selected="true"]{color:var(--asm-vinho);border-bottom-color:var(--asm-vinho);font-weight:600}
.contador{
  display:inline-block;margin-left:6px;padding:0 5px;border-radius:8px;
  background:var(--alert);color:#fff;font-size:11px;font-weight:600;line-height:16px;
}
@media (prefers-color-scheme:dark){.contador{color:#101514}}

/* ---------- gaveta de contas ---------- */
#gaveta{
  position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:var(--panel);
  border-right:1px solid var(--rule);z-index:50;transform:translateX(-102%);
  transition:transform .22s ease;display:flex;flex-direction:column;
}
#gaveta.aberta{transform:none}
#veu{position:fixed;inset:0;background:rgba(10,16,15,.4);z-index:40;display:none}
#veu.aberta{display:block}
.gaveta-topo{padding:16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.gaveta-topo h2{font-size:14px;font-weight:600;margin:0;flex:1}
.gaveta-topo button{font-size:20px;line-height:1;color:var(--ink-soft);padding:4px}
.busca{padding:12px 16px;border-bottom:1px solid var(--rule)}
.busca input{
  width:100%;font:inherit;font-size:14px;padding:8px 10px;background:var(--paper);
  color:var(--ink);border:1px solid var(--rule-strong);border-radius:5px;
}
.lista-contas{overflow-y:auto;flex:1;padding:6px 0}
.item-conta{
  display:block;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule);
}
.item-conta:hover{background:var(--paper)}
.item-conta .rot{font-size:14px;display:flex;align-items:center;gap:6px}
.item-conta .sub{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pin{width:6px;height:6px;border-radius:50%;flex:none;background:var(--rule-strong)}
.pin.ok{background:var(--in)}
.pin.alerta{background:var(--alert)}

/* ---------- blocos ---------- */
.fluxo{border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:20px;margin-bottom:20px}
.fluxo .rotulo{font-size:13px;color:var(--ink-soft);margin-bottom:2px}
.fluxo .saldo{font-size:34px;font-weight:600;letter-spacing:-0.03em;line-height:1.1}
.barra{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--rule);margin:18px 0 10px}
.barra i{display:block;height:100%}
.barra .e{background:var(--in)}
.barra .s{background:var(--out)}
.legenda{display:flex;flex-wrap:wrap;gap:18px;font-size:13px}
.legenda div{display:flex;flex-direction:column}
.legenda .v{font-weight:600;font-size:16px}
.legenda .k{color:var(--ink-soft);display:flex;align-items:center;gap:6px;font-size:12px}
.swatch{width:8px;height:8px;border-radius:2px;display:inline-block}

.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.cartao{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:14px}
.cartao .k{font-size:12px;color:var(--ink-soft)}
.cartao .v{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-top:2px}

h2.secao{font-size:14px;font-weight:600;margin:26px 0 10px;border-left:3px solid var(--asm-ouro);padding-left:9px}
.tabela-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-weight:500;font-size:12px;color:var(--ink-soft);
  padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover{background:var(--paper)}
.entrada{color:var(--in)}
.saida{color:var(--out)}
.vazio{padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:14px}

.aviso{
  border:1px solid var(--rule);border-left:3px solid var(--warn);border-radius:6px;
  background:var(--panel);padding:12px 14px;font-size:13.5px;margin-bottom:18px;
}
.aviso.grave{border-left-color:var(--alert)}
.aviso b{font-weight:600}

.alerta-item{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:14px;margin-bottom:10px;
  border-left:3px solid var(--warn)}
.alerta-item.grave{border-left-color:var(--alert)}
.alerta-item.navegavel{cursor:pointer}
.alerta-item.navegavel:hover{border-color:var(--rule-strong);background:var(--paper)}
.alerta-item .ir{font-size:12.5px;color:var(--in);margin-top:10px}
.filtros{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.filtros label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft);flex:1;min-width:150px}
.filtros select,.filtros input{
  font:inherit;font-size:14px;padding:8px 10px;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:5px;max-width:100%;width:100%;
}
.filtros .acao{display:flex;align-items:flex-end;flex:0 0 auto;min-width:0}
.limpar{
  font:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--rule-strong);
  border-radius:5px;background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.limpar:hover{border-color:var(--ink-soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chips button{
  font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule-strong);
  border-radius:999px;background:var(--panel);color:var(--ink-soft);cursor:pointer;
}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--asm-vinho);color:#FFF;border-color:var(--asm-vinho)}
.resultado{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px}
.resultado b{color:var(--ink);font-weight:600}
/* painéis do resumo executivo */
.duplo{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:18px}
.painel{border:1px solid var(--rule);border-radius:12px;background:var(--panel);padding:18px 18px 16px}
.painel .mes{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.painel .grande{font-size:30px;font-weight:600;letter-spacing:-0.03em;margin:6px 0 2px}
.painel .sob{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.split{display:flex;flex-direction:column;gap:11px}
.split .item .topo{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.split .item .topo b{white-space:nowrap}
.split .item .trilho{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.split .item .trilho i{display:block;height:100%;background:var(--asm-vinho)}
.split .item:nth-child(2) .trilho i{background:var(--asm-ouro)}
.split .item:nth-child(3) .trilho i{background:var(--in)}
.split .item:nth-child(4) .trilho i{background:var(--out)}
.split .item:nth-child(n+5) .trilho i{background:var(--asm-cinza)}

/* barra de filtros recolhível */
.filtro-barra{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.toggle-filtros{
  display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;
  padding:8px 13px;border:1px solid var(--rule-strong);border-radius:6px;
  background:var(--panel);color:var(--ink);cursor:pointer;
}
.toggle-filtros:hover{border-color:var(--asm-vinho)}
.toggle-filtros .seta{font-size:9px;opacity:.7;transition:transform .12s ease}
.toggle-filtros[aria-expanded="true"] .seta{transform:rotate(90deg)}
.toggle-filtros .qtd{
  background:var(--asm-vinho);color:#FFF;font-size:11px;font-weight:600;
  border-radius:9px;padding:0 6px;line-height:16px;
}
.filtros[hidden]{display:none}

/* gráficos */
.grafico{
  border:1px solid var(--rule);border-radius:10px;background:var(--panel);
  padding:14px 16px 10px;margin-bottom:16px;
}
.grafico h3{margin:0 0 2px;font-size:13.5px;font-weight:600}
.grafico .sub{margin:0 0 12px;font-size:12px;color:var(--ink-soft)}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.legenda-g{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.legenda-g span{display:inline-flex;align-items:center;gap:6px}
.legenda-g i{width:9px;height:9px;border-radius:2px;display:inline-block}
.g-vazio{
  padding:22px 14px;text-align:center;color:var(--ink-soft);font-size:13px;
  border:1px dashed var(--rule-strong);border-radius:8px;
}

/* blocos de indicadores */
.bloco-titulo{
  font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);
  margin:20px 0 9px;font-weight:600;
}
.grade.compacta{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:6px}
.grade.compacta .cartao{padding:11px 12px}
.grade.compacta .v{font-size:17px}
.cartao .sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px}

/* botão discreto de detalhes, ao lado de um resumo */
.btn-det{
  display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;
  padding:3px 9px;border:1px solid var(--rule-strong);border-radius:999px;
  background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap;margin-left:8px;
}
.btn-det:hover{color:var(--ink);border-color:var(--ink-soft)}
.btn-det i{font-style:normal;font-size:11px}

/* detalhe da marca na linha: fechado por padrão, abre na seta */
details.marca{margin-top:3px}
details.marca>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--ink-soft);
}
details.marca>summary::-webkit-details-marker{display:none}
details.marca>summary .seta{transition:transform .12s ease;font-size:9px;opacity:.7}
details.marca[open]>summary .seta{transform:rotate(90deg)}
details.marca>summary:hover{color:var(--ink)}
details.marca .corpo{
  font-size:11.5px;color:var(--ink-soft);line-height:1.5;
  padding:6px 0 2px 14px;border-left:1px solid var(--rule);margin:4px 0 0 3px;
}
details.marca .corpo p{margin:0 0 5px}
details.marca .corpo p:last-child{margin:0}

/* pop-up de detalhes */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.overlay[hidden]{display:none}
.modal{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;
  max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3);
}
.modal header{
  display:flex;align-items:flex-start;gap:12px;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);
}
.modal header h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em}
.modal .fechar{
  font:inherit;font-size:18px;line-height:1;padding:2px 8px;border:1px solid var(--rule-strong);
  border-radius:5px;background:var(--panel);color:var(--ink-soft);cursor:pointer;flex:0 0 auto;
}
.modal .fechar:hover{color:var(--ink)}
.modal .conteudo{padding:16px 18px}
.modal .conteudo p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
.modal .conteudo .tabela-wrap{margin-bottom:14px}
.ponto{
  display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--alert);vertical-align:middle;
}
.ponto.atencao{background:var(--warn)}
tr.marcada td{background:color-mix(in srgb, var(--alert) 5%, transparent)}
tr.marcada.atencao td{background:color-mix(in srgb, var(--warn) 5%, transparent)}
.motivos{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.motivos span{display:flex;gap:6px;align-items:baseline}
.tag{
  display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--rule-strong);color:var(--ink-soft);white-space:nowrap;
}
.alerta-item .cab{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.alerta-item .tit{font-weight:600;font-size:14px}
.alerta-item .conta{font-size:12px;color:var(--ink-soft)}
.alerta-item .txt{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
.alerta-item .val{font-variant-numeric:tabular-nums;font-weight:600}

.voltar{font-size:13px;color:var(--ink-soft);padding:6px 0;margin-bottom:8px;display:inline-block}
.ficha{border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:16px;margin-bottom:18px}
.ficha h2{font-size:18px;margin:0 0 4px;font-weight:600;letter-spacing:-0.02em}
.ficha dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin:12px 0 0}
.ficha dt{font-size:12px;color:var(--ink-soft)}
.ficha dd{margin:0;font-size:14px;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--rule);padding:18px 16px 30px;color:var(--ink-soft);font-size:12px;
  max-width:1080px;margin:0 auto}
.rodape-marca{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.rodape-marca b{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--asm-vinho)}
.rodape-marca span{display:block;font-size:11px;margin-top:2px}


/* ---------- tela de resumo ---------- */
.regua-bloco{
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:26px 26px 22px;margin-bottom:16px;
}
.regua-olho{font-size:13px;color:var(--ink-soft)}
.regua-heroi{
  font-size:clamp(32px,6.6vw,50px);font-weight:600;letter-spacing:-.035em;
  line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums;
}
.regua-heroi small{font-size:.38em;font-weight:400;color:var(--ink-soft);letter-spacing:-.01em}
.regua-barra{display:flex;height:44px;border-radius:6px;overflow:hidden;background:var(--rule);margin-top:24px}
.regua-barra i{display:block;height:100%}
.regua-marcas{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.regua-marcas .m{flex:1 1 160px;padding-left:12px;border-left:3px solid}
.regua-marcas .m .k{font-size:12.5px;color:var(--ink-soft)}
.regua-marcas .m .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.regua-marcas .m .s{font-size:11.5px;color:var(--ink-soft);margin-top:1px;opacity:.85}

.faixa-ind{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  border:1px solid var(--rule);border-radius:12px;background:var(--panel);
  overflow:hidden;margin-bottom:16px;
}
.faixa-ind .cel{padding:16px 18px;border-right:1px solid var(--rule)}
.faixa-ind .cel:last-child{border-right:0}
.faixa-ind .k{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px}
.faixa-ind .v{font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.faixa-ind .s{font-size:11.5px;color:var(--ink-soft);margin-top:3px;opacity:.85}
@media (max-width:560px){.faixa-ind .cel{border-right:0;border-bottom:1px solid var(--rule)}
  .faixa-ind .cel:last-child{border-bottom:0}}



/* ---------- impressão: o Resumo vira uma folha A4 limpa ---------- */
@media print{
  @page{size:A4 portrait;margin:14mm}
  :root{
    --paper:#FFFFFF;--panel:#FFFFFF;--ink:#1C1715;--ink-soft:#5C524D;
    --rule:#DDD6D0;--rule-strong:#B9AFA8;--in:#1F6F5C;--out:#8A6516;
    --asm-ouro:#9A7C33;
  }
  html,body{background:#FFF !important;color:#1C1715 !important}
  #marca-dagua, nav.abas, header.topo, .filete, #gaveta, #veu, .filtro-barra, .filtros,
  .toggle-filtros, .limpar, .chips, .btn-det, .voltar, .overlay, #sel-comp, .imprimir{display:none !important}
  .regua-bloco,.grafico,.faixa-ind,.painel,.cartao,.tabela-wrap{
    border-color:#DDD6D0 !important;background:#FFF !important;box-shadow:none !important;
    break-inside:avoid;page-break-inside:avoid;
  }
  .grafico svg rect, .regua-barra i{animation:none !important;transform:none !important}
  #tela{max-width:none;padding:0}
  /* cabeçalho impresso, invisível na tela */
  .papel-cab{display:flex !important;align-items:center;gap:12px;border-bottom:2px solid var(--asm-vinho);
    padding-bottom:10px;margin-bottom:16px}
  .papel-cab img{height:46px;width:auto}
  .papel-cab b{display:block;font-size:13px;letter-spacing:.07em;color:var(--asm-vinho)}
  .papel-cab span{display:block;font-size:11.5px;color:#5C524D;margin-top:2px}
  .papel-rod{display:block !important;margin-top:18px;padding-top:8px;border-top:1px solid #DDD6D0;
    font-size:10.5px;color:#5C524D}
}
.papel-cab,.papel-rod{display:none}
.imprimir{
  display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;
  padding:7px 12px;border:1px solid var(--rule-strong);border-radius:6px;
  background:var(--panel);color:var(--ink-soft);cursor:pointer;margin-left:auto;
}
.imprimir:hover{border-color:var(--asm-ouro);color:var(--ink)}
.linha-acao{display:flex;align-items:center;gap:10px;margin-bottom:12px}


/* A fileira de abas continua podendo deslizar em telas muito estreitas, mas
   sem desenhar a barra de rolagem, que aparecia vazia com só quatro abas. */
nav.abas{scrollbar-width:none;-ms-overflow-style:none}
nav.abas::-webkit-scrollbar{display:none}
#gaveta{scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
/* nas tabelas a barra é útil, mas fica discreta */
.tabela-wrap{scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.tabela-wrap::-webkit-scrollbar{height:8px;width:8px}
.tabela-wrap::-webkit-scrollbar-track{background:transparent}
.tabela-wrap::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:4px}
.tabela-wrap::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}


/* ---------- tema claro ----------
   O escuro é o padrão. O claro existe para quem vai projetar numa reunião ou
   imprimir, e precisa do ouro mais fechado para ter contraste no branco. */
:root[data-tema="claro"]{
  --paper:#F6F4F3; --panel:#FFFFFF; --ink:#1E1715; --ink-soft:#6B5F5C;
  --rule:#E6E0DC; --rule-strong:#CBC1BE;
  --in:#1F6F5C; --out:#8A6516; --alert:#C0392B; --warn:#A87513;
  --focus:#8E332B; --asm-ouro:#9A7C33;
  color-scheme: light;
}
:root[data-tema="claro"] .marca .nome b,
:root[data-tema="claro"] .porta-org b,
:root[data-tema="claro"] .rodape-marca b{color:var(--asm-vinho)}
:root[data-tema="claro"] nav.abas button[aria-selected="true"]{color:var(--asm-vinho);border-bottom-color:var(--asm-vinho)}
:root[data-tema="claro"] .chips button[aria-pressed="true"]{background:var(--asm-vinho);color:#FFF;border-color:var(--asm-vinho)}
:root[data-tema="claro"] .toggle-filtros .qtd{background:var(--asm-vinho);color:#FFF}
:root[data-tema="claro"] #marca-dagua img{opacity:.055;filter:none}
:root[data-tema="claro"] .modal,
:root[data-tema="claro"] .regua-bloco,
:root[data-tema="claro"] .grafico,
:root[data-tema="claro"] .faixa-ind{box-shadow:0 1px 0 rgba(30,23,21,.04)}

.btn-tema{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;flex:0 0 auto;font-size:15px;line-height:1;
  border:1px solid var(--rule-strong);border-radius:8px;
  background:var(--panel);color:var(--ink-soft);cursor:pointer;
}
.btn-tema:hover{color:var(--ink);border-color:var(--asm-ouro)}


/* ---------- tabelas viram cartões no celular ----------
   A tabela do consolidado tem muitas colunas e rolava de lado no telefone.
   Abaixo de 640px cada conta vira um cartão empilhado, com o rótulo da coluna
   à esquerda e o valor à direita. */
@media (max-width:640px){
  table.cartoes thead{display:none}
  table.cartoes, table.cartoes tbody{display:block}
  table.cartoes tr{
    display:block;border:1px solid var(--rule);border-radius:10px;
    background:var(--panel);padding:11px 13px;margin-bottom:10px;
  }
  table.cartoes td{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border:0;padding:5px 0;text-align:right;
  }
  table.cartoes td+td{border-top:1px solid var(--rule)}
  table.cartoes td::before{
    content:attr(data-r);color:var(--ink-soft);font-size:12px;
    text-align:left;white-space:nowrap;
  }
  table.cartoes td:first-child{
    display:block;text-align:left;padding-bottom:8px;margin-bottom:4px;
    border-bottom:1px solid var(--rule);
  }
  table.cartoes td:first-child::before,
  table.cartoes td[colspan]::before{content:none}
}


/* ---------- abertura ----------
   Depois do código aceito, o escudo entra grande, segura um instante e recua
   até virar a marca d'água do fundo, enquanto o painel surge por cima. */
#abertura{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:var(--paper);pointer-events:none;
}
#abertura[hidden]{display:none}
/* 343px é a largura real da imagem: acima disso ela borra */
#abertura img{width:min(58vw,300px);height:auto;will-change:transform,opacity}
@media (prefers-reduced-motion: no-preference){
  #abertura img{animation:escudo-entra 1.75s cubic-bezier(.22,.7,.2,1) forwards}
  #abertura{animation:abertura-sai 1.75s ease forwards}
  #app.entrando{animation:painel-surge .75s ease .95s both}
}
@keyframes escudo-entra{
  0%{transform:scale(.86);opacity:0}
  22%{transform:scale(1);opacity:1}
  52%{transform:scale(1);opacity:1}
  100%{transform:scale(1.10);opacity:.05}
}
@keyframes abertura-sai{
  0%,62%{background:var(--paper)}
  100%{background:transparent}
}
@keyframes painel-surge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- movimento ---------- */
@media (prefers-reduced-motion: no-preference){
  .grafico svg rect.barra{
    transform-box:fill-box;transform-origin:bottom;
    animation:crescer .62s cubic-bezier(.2,.75,.25,1) both;
  }
  .grafico svg text.rot-valor{animation:surgir .5s ease both}
  @keyframes crescer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes surgir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .regua-barra i{animation:abrir .7s cubic-bezier(.2,.75,.25,1) both}
  @keyframes abrir{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .regua-barra i{transform-origin:left}
}
.grafico svg .grade{stroke:var(--rule);stroke-width:1}
.grafico svg .grade-rot{font-size:10.5px;fill:var(--ink-soft)}

/* ---------- identidade final: sala de controle ----------
   O painel passa a ter uma só vestimenta, independente do tema do aparelho:
   carvão quente, com o vinho e o ouro da ASM como acentos. */
:root{
  --paper:#14100F;
  --panel:#1C1715;
  --ink:#EDE6DF;
  --ink-soft:#9C8F86;
  --rule:#2C2522;
  --rule-strong:#3D3531;
  --in:#6FAE95;
  --out:#C6A35A;
  --alert:#E8756A;
  --warn:#D8B25C;
  --focus:#D9A08F;
  color-scheme: dark;
}
.marca .nome b, .porta-org b, .rodape-marca b{color:#D9A08F}
nav.abas button[aria-selected="true"]{color:#E8B9A8;border-bottom-color:#E8B9A8}
.chips button[aria-pressed="true"]{background:#E8B9A8;color:#14100F;border-color:#E8B9A8}
.toggle-filtros .qtd{background:#E8B9A8;color:#14100F}
.btn{background:#8E332B}
.btn:hover{background:#A03B32}
h2.secao{border-left-color:var(--asm-ouro)}

/* escudo da ASM ao fundo, discreto e centralizado */
#marca-dagua{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
#marca-dagua img{
  width:min(62vw,330px);height:auto;opacity:.05;
  filter:grayscale(.2) contrast(1.05);
}
#app, #porta{position:relative;z-index:1}

/* Códigos de acesso. Cada destinatário recebe o seu; "contas" limita o que ele vê. */
/* O código de acesso não fica gravado aqui: ele é a chave que abre COFRE. */

/* ===================== utilidades ===================== */
const brl = v => v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const brlCurto = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if (a >= 1e3) return (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mil";
  return brl(v);
};
const rotuloComp = c => {
  const [a, m] = c.split("-");
  const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return meses[parseInt(m,10)-1] + " de " + a;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== modalidades e tarifas ===================== */
const MODALIDADES = [
  {id:"ted",    rot:"TED",                   teste:/\bTED\b/i},
  {id:"pix",    rot:"Pix",                   teste:/\bPIX\b/i},
  {id:"boleto", rot:"Boleto",                teste:/BOLETO|T[ÍI]TULO/i},
  {id:"tef",    rot:"TEF (mesma instituição)", teste:/\bTEF\b/i}
];
const ehTarifa  = l => /^\s*tarifa\b|tarifa -|cesta|taxa de servi/i.test(l.transacao);
const ehTaxaEntrada = l => /taxa de entrada/i.test(l.transacao);
const ehEstorno = l => /estorno/i.test(l.transacao);
const modalidadeDe = l => (MODALIDADES.find(m => m.teste.test(l.transacao)) || {id:"outros"}).id;
const rotuloModalidade = id => (MODALIDADES.find(m => m.id === id) || {rot:"Outras operações"}).rot;

/* A taxa de entrada é percentual sobre o crédito recebido. O próprio texto do
   lançamento traz a base ("Transação de R$ 1.000,00 em 01/01/2000"), então dá
   para recalcular a alíquota efetiva de cada cobrança. */
function baseDaTransacao(texto) {
  const m = String(texto).replace(/\u00a0/g, " ").match(/R\$\s*([\d.]+,\d{2})/);
  if (!m) return null;
  return parseFloat(m[1].replace(/\./g, "").replace(",", "."));
}

function apurarTaxaEntrada(lanc) {
  const linhas = lanc.filter(ehTaxaEntrada).map(l => {
    const base = baseDaTransacao(l.transacao);
    return {
      data: l.data, base, valor: Math.abs(l.valor),
      aliquota: base ? +(Math.abs(l.valor) / base * 100).toFixed(4) : null
    };
  });
  const total = +linhas.reduce((s,l) => s + l.valor, 0).toFixed(2);
  /* A alíquota efetiva varia na terceira casa por causa do arredondamento de
     centavos. Para comparar faixas de preço, o que vale é a taxa contratada,
     então as alíquotas são agrupadas em duas casas. */
  const aliquotas = [...new Set(linhas.map(l => l.aliquota).filter(a => a !== null)
                                      .map(a => +a.toFixed(2)))].sort((a,b) => a-b);
  return {linhas, total, aliquotas, quantidade: linhas.length};
}

/* Amarração nominal: cada débito de tarifa traz, no próprio texto, o valor e a
   data do pagamento que a gerou ("Tarifa - Envio TED-Transação de R$ 1.000,00
   em 01/01/2000"). Isso permite casar tarifa e pagamento um a um, em vez de só
   comparar totais. O extrato corta o texto em ~60 caracteres, então o ano às
   vezes vem truncado — por isso a data é comparada por dia/mês. */
function diaMesDoTexto(t) {
  const m = String(t).match(/(\d{2}\/\d{2})\/\d{2,4}/);
  return m ? m[1] : null;
}

function parearTarifas(lanc) {
  const t = BASE.tarifario;
  /* Guarda o índice de cada linha no extrato para conseguir marcar a própria
     linha na tela depois, e não só somar totais. */
  /* Tarifas de manutenção de conta não nascem de um pagamento, então ficam
     fora do pareamento — senão apareceriam como tarifa sem lastro. */
  const ehManutencao = l => /manuten|mensalidade/i.test(l.transacao);
  const tarifas = [], pagamentos = [], fixas = [];
  lanc.forEach((l, i) => {
    if (ehTarifa(l) && ehManutencao(l)) fixas.push({l, i});
    else if (ehTarifa(l)) tarifas.push({l, i});
    else if (l.valor < 0 && !ehTaxaEntrada(l) && (t.itens[modalidadeDe(l)] ?? 0) > 0) pagamentos.push({l, i});
  });

  const usados = new Set();
  const casadas = [], orfas = [];
  tarifas.forEach(tf => {
    const base = baseDaTransacao(tf.l.transacao), dm = diaMesDoTexto(tf.l.transacao);
    const k = pagamentos.findIndex(pg =>
      !usados.has(pg.i) && base !== null &&
      Math.abs(Math.abs(pg.l.valor) - base) < 0.005 &&
      pg.l.data.slice(0, 5) === dm);
    if (k >= 0) { usados.add(pagamentos[k].i); casadas.push({tarifa: tf, pagamento: pagamentos[k]}); }
    else orfas.push(tf);
  });

  const semTarifa = pagamentos.filter(pg => !usados.has(pg.i));
  const devido = +semTarifa.reduce((s, pg) => s + (t.itens[modalidadeDe(pg.l)] ?? 0), 0).toFixed(2);
  const cobradoOrfao = +orfas.reduce((s, tf) => s + Math.abs(tf.l.valor), 0).toFixed(2);

  const manutencao = +fixas.reduce((s, f) => s + Math.abs(f.l.valor), 0).toFixed(2);
  return {tarifas, pagamentos, casadas, orfas, semTarifa, devido, cobradoOrfao, fixas, manutencao};
}

/* Ciclo de estorno: um pagamento volta e, muitas vezes, é reenviado logo em
   seguida. Agrupando por contraparte (CNPJ quando existe) e valor, dá para
   separar o que foi refeito e quitado do que voltou e ficou parado. O critério
   é o líquido: se saiu mais vezes do que voltou, a última tentativa vingou. */
function cicloEstornos(lanc) {
  const grupos = new Map();
  lanc.forEach((l, i) => {
    if (ehTarifa(l) || ehTaxaEntrada(l) || l.interno) return;
    const saida = l.valor < 0 && !ehEstorno(l);
    const estorno = ehEstorno(l);
    if (!saida && !estorno) return;
    const k = (l.doc || l.nome).trim().toUpperCase() + "|" + Math.abs(l.valor).toFixed(2);
    if (!grupos.has(k)) grupos.set(k, {nome: l.nome, doc: l.doc, valor: Math.abs(l.valor), saidas: [], estornos: []});
    (saida ? grupos.get(k).saidas : grupos.get(k).estornos).push(i);
  });

  /* Um estorno cuja saída não está neste extrato devolve um pagamento feito
     antes do período. Não é pagamento parado: fica de fora da conta. */
  const todosComEstorno = [...grupos.values()].filter(g => g.estornos.length);
  const anteriores = todosComEstorno.filter(g => !g.saidas.length);
  const comEstorno = todosComEstorno.filter(g => g.saidas.length);
  comEstorno.forEach(g => {
    g.resolvido = g.saidas.length > g.estornos.length;
    g.tentativas = Math.min(g.saidas.length, g.estornos.length);
  });
  const pendentes = comEstorno.filter(g => !g.resolvido);
  const resolvidos = comEstorno.filter(g => g.resolvido);
  const tentativasPerdidas = comEstorno.reduce((s, g) => s + g.tentativas, 0);
  const valorParado = +pendentes.reduce((s, g) => s + g.valor, 0).toFixed(2);
  const custoTentativas = +comEstorno.reduce((s, g) => {
    const un = BASE.tarifario.itens[modalidadeDe(lanc[g.saidas[0]])] ?? 0;
    return s + g.tentativas * un;
  }, 0).toFixed(2);

  return {grupos: comEstorno, pendentes, resolvidos, anteriores,
          tentativasPerdidas, valorParado, custoTentativas};
}

/* Conta as operações tarifáveis, projeta o que o tarifário cobraria e
   compara com as tarifas efetivamente debitadas no extrato. */
function apurarTarifas(lanc) {
  const t = BASE.tarifario;
  const linhas = [];
  let esperadoTotal = 0;

  ["ted","pix","boleto","tef","outros"].forEach(id => {
    const saidas = lanc.filter(l => l.valor < 0 && !ehTarifa(l) && !ehTaxaEntrada(l) && modalidadeDe(l) === id);
    const estornadas = lanc.filter(l => l.valor > 0 && ehEstorno(l) && modalidadeDe(l) === id).length;
    if (!saidas.length) return;
    const unit = t.itens[id] ?? 0;
    const tarifaveis = t.estornoDevolveTarifa ? saidas.length - estornadas : saidas.length;
    const esperado = +(tarifaveis * unit).toFixed(2);
    esperadoTotal += esperado;
    linhas.push({id, rot: rotuloModalidade(id), operacoes: saidas.length, estornadas, tarifaveis, unit, esperado});
  });

  if (t.manutencaoMensal > 0) {
    esperadoTotal += t.manutencaoMensal;
    linhas.push({id:"manutencao", rot:"Manutenção de conta", operacoes:1, estornadas:0,
                 tarifaveis:1, unit:t.manutencaoMensal, esperado:t.manutencaoMensal});
  }

  const cobradas = lanc.filter(ehTarifa);
  const cobradoTotal = +cobradas.reduce((s,l) => s + Math.abs(l.valor), 0).toFixed(2);

  /* Cruzamento dia a dia: onde saíram operações tarifáveis e nenhuma tarifa
     foi debitada, ou o contrário. É o que localiza a divergência na data. */
  const porData = {};
  lanc.forEach(l => {
    const d = l.data;
    porData[d] = porData[d] || {data: d, operacoes: 0, tarifas: 0, previsto: 0, cobrado: 0};
    if (ehTarifa(l)) { porData[d].tarifas++; porData[d].cobrado += Math.abs(l.valor); }
    else if (l.valor < 0 && !ehTaxaEntrada(l)) {
      const unit = t.itens[modalidadeDe(l)] ?? 0;
      if (unit > 0) { porData[d].operacoes++; porData[d].previsto += unit; }
    }
  });
  const dias = Object.values(porData)
    .map(d => ({...d, previsto: +d.previsto.toFixed(2), cobrado: +d.cobrado.toFixed(2),
                diferenca: +(d.cobrado - d.previsto).toFixed(2)}))
    .filter(d => d.operacoes || d.tarifas);

  return {
    linhas, cobradas, dias,
    diasDivergentes: dias.filter(d => Math.abs(d.diferenca) >= 0.01),
    esperadoTotal: +esperadoTotal.toFixed(2),
    cobradoTotal,
    diferenca: +(cobradoTotal - esperadoTotal).toFixed(2),
    quantidadeCobrada: cobradas.length
  };
}

/* ===================== motor de conciliação ===================== */
function analisar(conta, comp) {
  const d = conta.dados[comp];
  if (!d) return null;
  const lanc = d.lancamentos || [];
  let entradas = 0, saidas = 0;
  lanc.forEach(l => { if (l.valor >= 0) entradas += l.valor; else saidas += Math.abs(l.valor); });

  const tar = apurarTarifas(lanc);
  const par = parearTarifas(lanc);
  const ciclo = cicloEstornos(lanc);
  const txe = apurarTaxaEntrada(lanc);
  /* Uma marca por linha do extrato. É o que acende o ponto na tabela e o que
     permite contar quantos lançamentos, individualmente, têm ocorrência. */
  const marcas = lanc.map(() => []);
  const saidasOperacionais = +(saidas - tar.cobradoTotal - txe.total).toFixed(2);

  const saldoCalculado = d.saldoAnterior + entradas - saidas;
  const difSaldo = +(d.saldoDeclarado - saldoCalculado).toFixed(2);

  const alertas = [];

  // 1. fechamento de saldo
  if (d.parcial) {
    alertas.push({
      nivel: "atencao", tipo: "parcial", contaId: conta.id, conta: conta.apelido,
      titulo: "Extrato parcial",
      texto: "Os lançamentos carregados cobrem parte do período. O saldo declarado de " + brl(d.saldoDeclarado) +
             " não pode ser fechado contra " + brl(saldoCalculado) + " enquanto faltarem páginas do extrato.",
      valor: null
    });
  } else if (Math.abs(difSaldo) >= 0.01) {
    alertas.push({
      nivel: "grave", tipo: "saldo", contaId: conta.id, conta: conta.apelido,
      titulo: "Saldo não fecha",
      texto: "Saldo anterior mais entradas, menos saídas e tarifas, resulta em " + brl(saldoCalculado) +
             ", mas o extrato declara " + brl(d.saldoDeclarado) + ".",
      valor: difSaldo
    });
  }

  // 2. encadeamento linha a linha
  let corrente = d.saldoAnterior;
  lanc.forEach((l, i) => {
    corrente = +(corrente + l.valor).toFixed(2);
    if (typeof l.saldo === "number" && Math.abs(corrente - l.saldo) >= 0.01) {
      alertas.push({
        nivel: "grave", tipo: "encadeamento", contaId: conta.id, conta: conta.apelido,
        titulo: "Quebra na sequência de saldos",
        texto: "Linha " + (i+1) + " (" + l.data + ", " + l.nome + "): o saldo esperado era " +
               brl(corrente) + " e o extrato traz " + brl(l.saldo) + ".",
        valor: +(l.saldo - corrente).toFixed(2)
      });
      marcas[i].push({id:"encadeamento", nivel:"grave", rot:"Quebra de sequência",
        txt:"O saldo desta linha não segue do anterior."});
      corrente = l.saldo;
    }
  });

  // 3. estornos — pagamentos que voltaram
  const estornos = lanc.filter(ehEstorno);
  if (estornos.length) {
    const totalEstornado = estornos.reduce((s,e) => s + Math.abs(e.valor), 0);
    const motivos = {};
    estornos.forEach(e => {
      const m = (e.transacao.split(/TED-\d+-/)[1] || "motivo não informado").trim().toLowerCase();
      motivos[m] = (motivos[m] || 0) + 1;
    });
    const resumoMotivos = Object.entries(motivos)
      .sort((a,b) => b[1] - a[1])
      .map(([m,n]) => n + " por " + m).join("; ");
    alertas.push({
      nivel: "atencao", tipo: "estorno", contaId: conta.id, conta: conta.apelido,
      titulo: estornos.length + (estornos.length > 1 ? " pagamentos estornados" : " pagamento estornado"),
      texto: brl(totalEstornado) + " saíram e voltaram para a conta no período — " + resumoMotivos +
             ". São pagamentos a refazer, e os prestadores seguem a receber.",
      valor: totalEstornado
    });
  }

  // 4. tarifas contra o tarifário
  if (tar.esperadoTotal > 0 && tar.quantidadeCobrada === 0) {
    alertas.push({
      nivel: d.parcial ? "atencao" : "grave", tipo: "tarifa", contaId: conta.id, conta: conta.apelido,
      titulo: "Tarifas não localizadas",
      texto: "As operações do período deveriam gerar " + brl(tar.esperadoTotal) +
             " em tarifas pelo tarifário cadastrado, e nenhum débito de tarifa aparece no extrato" +
             (d.parcial ? " carregado até aqui." : ". Verifique se a cobrança é mensal e cai em outra data."),
      valor: tar.esperadoTotal
    });
  } else if (Math.abs(tar.diferenca) >= 0.01 && !par.semTarifa.length && !par.orfas.length) {
    const dd = tar.diasDivergentes;
    const detalhe = dd.length
      ? " A diferença se concentra em " + dd.map(d =>
          d.data + " (" + d.operacoes + " operação(ões) tarifável(is), " + d.tarifas +
          " tarifa(s) debitada(s))").join("; ") + "."
      : "";
    alertas.push({
      nivel: "grave", tipo: "tarifa", contaId: conta.id, conta: conta.apelido,
      titulo: tar.diferenca > 0 ? "Tarifa cobrada a maior" : "Tarifa cobrada a menor",
      texto: "O extrato traz " + tar.quantidadeCobrada + " débito(s) de tarifa somando " + brl(tar.cobradoTotal) +
             ", contra " + brl(tar.esperadoTotal) + " previstos no tarifário." + detalhe,
      valor: tar.diferenca
    });
  }

  // 4b. amarração nominal tarifa <-> pagamento
  if (par.semTarifa.length) {
    const porDia = {};
    par.semTarifa.forEach(pg => { porDia[pg.l.data] = (porDia[pg.l.data] || 0) + 1; });
    const resumoDias = Object.entries(porDia)
      .map(([dt, n]) => dt + " (" + n + ")").join("; ");
    const exemplos = par.semTarifa.slice(0, 3)
      .map(pg => brl(Math.abs(pg.l.valor)) + " para " + pg.l.nome).join("; ");
    alertas.push({
      nivel: "grave", tipo: "tarifa", contaId: conta.id, conta: conta.apelido,
      titulo: "Pagamentos sem tarifa correspondente",
      texto: par.casadas.length + " das " + par.tarifas.length + " tarifas do extrato casam, uma a uma, com o " +
             "pagamento que as gerou (mesmo valor e mesma data no texto do débito). Sobram " +
             par.semTarifa.length + " pagamento(s) tarifável(is) sem nenhuma tarifa amarrada, em " +
             resumoDias + ". Pelo tarifário isso equivale a " + brl(par.devido) +
             " não cobrados. Exemplos: " + exemplos + ".",
      valor: par.devido
    });
  }
  if (par.orfas.length) {
    alertas.push({
      nivel: "grave", tipo: "tarifa", contaId: conta.id, conta: conta.apelido,
      titulo: "Tarifas sem pagamento que as justifique",
      texto: par.orfas.length + " débito(s) de tarifa somando " + brl(par.cobradoOrfao) +
             " citam uma transação que não aparece no extrato desta conta e período. " +
             "É o caso a questionar com a instituição, porque foi dinheiro debitado sem lastro visível.",
      valor: par.cobradoOrfao
    });
  }

  // 4c. ciclo de estorno: o pagamento foi refeito ou ficou parado?
  if (ciclo.pendentes.length) {
    const ex = ciclo.pendentes.slice(0, 3).map(g => g.nome + " (" + brl(g.valor) + ")").join("; ");
    alertas.push({
      nivel: "grave", tipo: "estorno", contaId: conta.id, conta: conta.apelido,
      titulo: "Pagamentos estornados e não refeitos",
      texto: ciclo.grupos.length + " pagamento(s) foram devolvidos no período. " +
             ciclo.resolvidos.length + " voltaram a sair depois e se resolveram; " +
             ciclo.pendentes.length + " não tiveram reenvio e somam " + brl(ciclo.valorParado) +
             " que não chegaram ao destinatário. Exemplos: " + ex + ".",
      valor: ciclo.valorParado
    });
  }
  if (ciclo.tentativasPerdidas > 0 && ciclo.custoTentativas > 0) {
    alertas.push({
      nivel: "atencao", tipo: "tarifa", contaId: conta.id, conta: conta.apelido,
      titulo: "Tarifa paga em tentativas que voltaram",
      texto: ciclo.tentativasPerdidas + " tentativa(s) de pagamento foram estornadas e, como o estorno não " +
             "devolve a tarifa, ficaram " + brl(ciclo.custoTentativas) + " de tarifa sem contrapartida. " +
             "Corrigir o cadastro dos prestadores elimina esse custo.",
      valor: ciclo.custoTentativas
    });
  }

  // 5. taxa de entrada sobre créditos recebidos
  const esperadaTxe = BASE.tarifario.taxaEntrada.aliquota;
  if (txe.aliquotas.length > 1) {
    alertas.push({
      nivel: "grave", tipo: "taxa", contaId: conta.id, conta: conta.apelido,
      titulo: "Alíquotas diferentes de taxa de entrada",
      texto: "No mesmo período a instituição aplicou " + txe.aliquotas.length + " alíquotas distintas sobre os créditos: " +
             txe.aliquotas.map(a => a.toFixed(2).replace(".", ",") + "%").join(", ") +
             ". São " + txe.quantidade + " cobranças somando " + brl(txe.total) + ".",
      valor: txe.total
    });
  }
  if (esperadaTxe !== null && esperadaTxe !== undefined) {
    txe.linhas.filter(l => l.aliquota !== null && Math.abs(l.aliquota - esperadaTxe*100) >= 0.005).forEach(l => {
      alertas.push({
        nivel: "grave", tipo: "taxa", contaId: conta.id, conta: conta.apelido,
        titulo: "Taxa de entrada fora do contratado",
        texto: "Crédito de " + brl(l.base) + " em " + l.data + " gerou taxa de " + brl(l.valor) +
               " (" + l.aliquota.toFixed(2).replace(".", ",") + "%), contra " +
               (esperadaTxe*100).toFixed(2).replace(".", ",") + "% contratados.",
        valor: +(l.valor - l.base * esperadaTxe).toFixed(2)
      });
    });
  }

  /* Marcas restantes: tarifa faltante, tarifa sem lastro, estorno e taxa de
     entrada fora da alíquota predominante da conta. */
  par.semTarifa.forEach(pg => {
    const unit = BASE.tarifario.itens[modalidadeDe(pg.l)] ?? 0;
    marcas[pg.i].push({id:"sem-tarifa", nivel:"grave", rot:"Sem tarifa cobrada",
      txt:"Pagamento tarifável sem nenhum débito de tarifa amarrado a ele. Pelo tarifário caberia " +
          brl(unit) + "."});
  });
  par.orfas.forEach(tf => {
    marcas[tf.i].push({id:"tarifa-orfa", nivel:"grave", rot:"Tarifa sem lastro",
      txt:"Esta tarifa cita uma transação que não aparece no extrato desta conta e período."});
  });
  lanc.forEach((l, i) => {
    if (l.interno) marcas[i].push({id:"interno", nivel:"atencao", rot:"Transferência entre contas",
      txt:"Movimento entre duas contas do próprio painel. Não entra no cash in nem no cash out."});
  });
  ciclo.grupos.forEach(g => {
    const quem = g.nome + " (" + brl(g.valor) + ")";
    if (g.resolvido) {
      g.estornos.forEach(i => marcas[i].push({id:"estorno-refeito", nivel:"atencao",
        rot:"Estorno já refeito",
        txt:"Voltou, mas o pagamento a " + quem + " foi reenviado depois e saiu. " +
            g.saidas.length + " tentativa(s) no mês."}));
    } else {
      g.estornos.forEach(i => marcas[i].push({id:"estorno-pendente", nivel:"grave",
        rot:"Estorno sem reenvio",
        txt:"O pagamento a " + quem + " voltou e não foi refeito dentro do período. " +
            g.saidas.length + " tentativa(s), " + g.estornos.length + " devolvida(s). O prestador não recebeu."}));
      g.saidas.forEach(i => marcas[i].push({id:"estorno-pendente", nivel:"grave",
        rot:"Pagamento não concluído",
        txt:"Esta saída a " + quem + " foi estornada e não há reenvio bem-sucedido no período."}));
    }
  });
  if (txe.aliquotas.length) {
    /* alíquota predominante da conta, para destacar a linha que destoa */
    const freq = {};
    txe.linhas.forEach(x => { if (x.aliquota !== null) freq[x.aliquota] = (freq[x.aliquota] || 0) + 1; });
    const moda = Object.keys(freq).sort((x, y) => freq[y] - freq[x])[0];
    const refer = BASE.tarifario.taxaEntrada.aliquota !== null
      ? BASE.tarifario.taxaEntrada.aliquota * 100 : (moda !== undefined ? parseFloat(moda) : null);
    if (refer !== null) {
      lanc.forEach((l, i) => {
        if (!ehTaxaEntrada(l)) return;
        const base = baseDaTransacao(l.transacao);
        if (!base) return;
        const aliq = Math.abs(l.valor) / base * 100;
        if (Math.abs(aliq - refer) >= 0.005) {
          marcas[i].push({id:"taxa", nivel:"grave", rot:"Alíquota divergente",
            txt:"Taxa de entrada a " + aliq.toFixed(2).replace(".", ",") + "%, contra " +
                refer.toFixed(2).replace(".", ",") + "% de referência."});
        }
      });
    }
  }

  return {
    entradas, saidas, saidasOperacionais, tarifas: tar, pareamento: par, ciclo, taxaEntrada: txe,
    saldoCalculado, difSaldo,
    saldoDeclarado: d.saldoDeclarado, saldoAnterior: d.saldoAnterior,
    periodo: d.periodo, parcial: !!d.parcial, emAndamento: !!d.emAndamento, lancamentos: lanc, marcas,
    estornados: estornos.reduce((s,e) => s + Math.abs(e.valor), 0),
    alertas
  };
}

/* Conteúdos dos pop-ups. São montados durante o render e abertos por
   data-modal, para o resumo da tela ficar curto. */
const MODAIS = {};

function abrirModal(id) {
  const m = MODAIS[id];
  if (!m) return;
  document.getElementById("modal-titulo").textContent = m.titulo;
  document.getElementById("modal-corpo").innerHTML = m.corpo;
  document.getElementById("overlay").hidden = false;
  document.body.style.overflow = "hidden";
  document.querySelector("#overlay .fechar").focus();
}
function fecharModal() {
  document.getElementById("overlay").hidden = true;
  document.body.style.overflow = "";
}
const botaoDetalhe = id => `<button class="btn-det" data-modal="${id}"><i>ⓘ</i> detalhes</button>`;

/* ===================== estado ===================== */
let ACESSO = null;
let comp = null;   /* definido depois que a base é aberta */
let aba = "resumo";
let contaAberta = null;
let filtroConta = "todas";
let filtroTipo = "todos";

/* Filtros do consolidado e de dentro da conta. Ficam em memória apenas
   enquanto a página está aberta — nada é gravado no navegador. */
let fGeral = {busca:"", de:"", ate:"", situacao:"todas", movimento:"todos", ocorrencia:"todas"};
let fConta = {busca:"", de:"", ate:"", natureza:"todas", categoria:"todas", ocorrencia:"todas", min:"", max:""};
let focoAtivo = null;   /* campo de texto que deve manter o cursor após o re-render */
let filtrosGeralAbertos = false;   /* barra de filtros do consolidado */
let filtrosContaAbertos = false;   /* barra de filtros dentro da conta */

/* Categoria de negócio de cada lançamento. A ordem importa: vale o primeiro
   teste que casar, então taxa e tarifa vêm antes de recebimento e envio. */
const CATEGORIAS = [
  {id:"taxa",        rot:"Taxa de entrada",       teste: l => ehTaxaEntrada(l)},
  {id:"tarifa",      rot:"Tarifa",                teste: l => ehTarifa(l)},
  {id:"estorno",     rot:"Estorno",               teste: l => ehEstorno(l)},
  {id:"recebimento", rot:"Recebimento",           teste: l => l.valor >= 0},
  {id:"ted",         rot:"Envio de TED",          teste: l => /\bTED\b/i.test(l.transacao)},
  {id:"pix",         rot:"Envio de Pix",          teste: l => /\bPIX\b/i.test(l.transacao)},
  {id:"boleto",      rot:"Pagamento de boleto",   teste: l => /BOLETO|T[ÍI]TULO/i.test(l.transacao)},
  {id:"tef",         rot:"Transferência interna", teste: l => /\bTEF\b/i.test(l.transacao)}
];
const categoriaDe = l => (CATEGORIAS.find(c => c.teste(l)) || {id:"outros"}).id;
const rotuloCategoria = id => (CATEGORIAS.find(c => c.id === id) || {rot:"Outros"}).rot;

/* dd/mm/aaaa -> aaaa-mm-dd, para comparar com os campos de data do filtro. */
const paraISO = d => {
  const m = String(d).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3] + "-" + m[2] + "-" + m[1] : "";
};
const dentroDoPeriodo = (l, de, ate) => {
  const iso = paraISO(l.data);
  if (de && iso < de) return false;
  if (ate && iso > ate) return false;
  return true;
};
/* Separa o que é dinheiro novo do que apenas circula.

   Além do estorno, que é pagamento devolvido, existe a transferência entre
   contas do próprio painel: ela sai de uma conta e entra em outra no mesmo
   dia e pelo mesmo valor. Contar isso como cash in e cash out infla os dois
   lados sem que nenhum real tenha entrado ou saído do grupo. Esses
   lançamentos vêm marcados com `interno` e são somados à parte.

   Um estorno entra na conta como crédito, mas não é receita: é um pagamento
   que voltou. Somá-lo às entradas infla o cash in e o cash out ao mesmo
   tempo. Por isso:
     cashIn  = créditos que não são estorno  (dinheiro que de fato entrou)
     cashOut = débitos operacionais          (sem tarifa e sem taxa)
     cashOutLiquido = cashOut menos o que voltou por estorno
   As entradas e saídas brutas continuam disponíveis porque são elas que
   fecham o saldo do extrato. */
const ehManutencaoTarifa = l => /manuten|mensalidade/i.test(l.transacao);
const somar = lanc => {
  let entradasBrutas = 0, saidasBrutas = 0, cashIn = 0, qtdCashIn = 0,
      estornado = 0, qtdEstorno = 0, cashOut = 0, qtdCashOut = 0, interno = 0, qtdInterno = 0,
      tarifaQtd = 0, tarifaTotal = 0, taxaQtd = 0, taxaTotal = 0, manutencao = 0;
  lanc.forEach(l => {
    if (l.valor >= 0) {
      entradasBrutas += l.valor;
      if (ehEstorno(l)) { estornado += l.valor; qtdEstorno++; }
      else if (l.interno) { interno += l.valor; qtdInterno++; }
      else { cashIn += l.valor; qtdCashIn++; }
      return;
    }
    const v = Math.abs(l.valor);
    saidasBrutas += v;
    if (ehTarifa(l)) {
      if (ehManutencaoTarifa(l)) manutencao += v;
      else { tarifaQtd++; tarifaTotal += v; }
    } else if (ehTaxaEntrada(l)) { taxaQtd++; taxaTotal += v; }
    else if (l.interno) { interno += v; qtdInterno++; }
    else { cashOut += v; qtdCashOut++; }
  });
  const r = n => +n.toFixed(2);
  return {entradas: r(entradasBrutas), saidas: r(saidasBrutas),
          cashIn: r(cashIn), qtdCashIn, estornado: r(estornado), qtdEstorno,
          interno: r(interno), qtdInterno,
          cashOut: r(cashOut), qtdCashOut, cashOutLiquido: r(cashOut - estornado),
          tarifaQtd, tarifaTotal: r(tarifaTotal),
          taxaQtd, taxaTotal: r(taxaTotal), manutencao: r(manutencao),
          custo: r(tarifaTotal + taxaTotal + manutencao)};
};
const filtroGeralAtivo = () => fGeral.busca || fGeral.de || fGeral.ate ||
  fGeral.situacao !== "todas" || fGeral.movimento !== "todos" || fGeral.ocorrencia !== "todas";
const filtroContaAtivo = () => fConta.busca || fConta.de || fConta.ate ||
  fConta.natureza !== "todas" || fConta.categoria !== "todas" || fConta.ocorrencia !== "todas" ||
  fConta.min !== "" || fConta.max !== "";

/* Rótulos das marcas de linha, usados no filtro de ocorrência da conta. */
const MARCAS = {
  "sem-tarifa":   "Sem tarifa cobrada",
  "tarifa-orfa":  "Tarifa sem lastro",
  "encadeamento": "Quebra de sequência",
  "interno":          "Transferência entre contas",
  "estorno-pendente": "Estorno sem reenvio",
  "estorno-refeito":  "Estorno já refeito",
  "taxa":         "Alíquota divergente"
};

const TIPOS_ALERTA = {
  saldo: "Saldo não fecha",
  encadeamento: "Quebra de sequência",
  estorno: "Pagamento estornado",
  tarifa: "Tarifa divergente",
  parcial: "Extrato parcial"
};

const contasVisiveis = () =>
  (!ACESSO || ACESSO.contas === "todas") ? BASE.contas : BASE.contas.filter(c => ACESSO.contas.includes(c.id));

function consolidado() {
  let entradas = 0, saidas = 0, saldo = 0, comDados = 0, alertas = [];
  let tarifaCobrada = 0, tarifaEsperada = 0, qtdTarifas = 0, operacoesSaida = 0;
  contasVisiveis().forEach(c => {
    const a = analisar(c, comp);
    if (!a) return;
    comDados++;
    entradas += a.entradas; saidas += a.saidas; saldo += a.saldoDeclarado;
    tarifaCobrada += a.tarifas.cobradoTotal;
    tarifaEsperada += a.tarifas.esperadoTotal;
    qtdTarifas += a.tarifas.quantidadeCobrada;
    operacoesSaida += a.tarifas.linhas.reduce((s,l) => s + (l.id === "manutencao" ? 0 : l.operacoes), 0);
    alertas = alertas.concat(a.alertas);
  });
  return {entradas, saidas, saldo, comDados, total: contasVisiveis().length, alertas,
          tarifaCobrada: +tarifaCobrada.toFixed(2), tarifaEsperada: +tarifaEsperada.toFixed(2),
          qtdTarifas, operacoesSaida};
}

/* Movimentação dia a dia: entradas para cima, saídas para baixo. */
function graficoDiario(lanc) {
  const dias = new Map();
  lanc.forEach(l => {
    const d = l.data.slice(0, 5);
    if (!dias.has(d)) dias.set(d, {e: 0, s: 0});
    // estorno é devolução, não cash in; tarifa e taxa saem do cash out
    if (l.valor >= 0) { if (!ehEstorno(l)) dias.get(d).e += l.valor; }
    else if (!ehTarifa(l) && !ehTaxaEntrada(l)) dias.get(d).s += Math.abs(l.valor);
  });
  const chaves = [...dias.keys()].sort((a, b) => {
    const [da, ma] = a.split("/"), [db, mb] = b.split("/");
    return (ma - mb) || (da - db);
  });
  if (chaves.length < 2) return `<div class="g-vazio">Movimentação concentrada em um único dia.</div>`;

  const W = 720, H = 210, padX = 4, meio = H / 2;
  const maxV = Math.max(...chaves.map(d => Math.max(dias.get(d).e, dias.get(d).s))) || 1;
  const larg = (W - padX * 2) / chaves.length;
  const bw = Math.max(2, Math.min(larg - 2, 22));

  let barras = "", eixo = "";
  chaves.forEach((d, i) => {
    const v = dias.get(d);
    const x = padX + i * larg + (larg - bw) / 2;
    const he = (v.e / maxV) * (meio - 16);
    const hs = (v.s / maxV) * (meio - 16);
    if (v.e) barras += `<rect class="barra" x="${x.toFixed(1)}" y="${(meio - he).toFixed(1)}" width="${bw.toFixed(1)}" height="${he.toFixed(1)}" rx="1.5" fill="var(--in)"><title>${d} · entradas ${brl(v.e)}</title></rect>`;
    if (v.s) barras += `<rect x="${x.toFixed(1)}" y="${meio.toFixed(1)}" width="${bw.toFixed(1)}" height="${hs.toFixed(1)}" rx="1.5" fill="var(--out)"><title>${d} · saídas ${brl(v.s)}</title></rect>`;
    const passo = Math.ceil(chaves.length / 10);
    if (i % passo === 0)
      eixo += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${d.slice(0, 2)}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Movimentação por dia">
    <line x1="0" y1="${meio}" x2="${W}" y2="${meio}" stroke="var(--rule-strong)" stroke-width="1"/>
    ${barras}${eixo}
  </svg>
  <div class="legenda-g">
    <span><i style="background:var(--in)"></i>Cash in</span>
    <span><i style="background:var(--out)"></i>Cash out</span>
    <span>Pico de ${brl(maxV)} em um dia</span>
  </div>`;
}

/* Composição das saídas por modalidade, em barra única empilhada. */
function graficoModalidades(lanc) {
  const cores = {ted:"var(--asm-vinho)", pix:"var(--asm-ouro)", boleto:"var(--out)",
                 tef:"var(--in)", outros:"var(--asm-cinza)"};
  const soma = {};
  lanc.forEach(l => {
    if (l.valor >= 0 || ehTarifa(l) || ehTaxaEntrada(l)) return;
    const m = modalidadeDe(l);
    if (!soma[m]) soma[m] = {v: 0, n: 0};
    soma[m].v += Math.abs(l.valor); soma[m].n++;
  });
  const itens = Object.entries(soma).sort((a, b) => b[1].v - a[1].v);
  if (!itens.length) return `<div class="g-vazio">Sem saídas operacionais no recorte.</div>`;
  const total = itens.reduce((s, [, x]) => s + x.v, 0);

  let x = 0, barra = "", leg = "";
  itens.forEach(([id, x2]) => {
    const w = (x2.v / total) * 100;
    barra += `<rect x="${x}%" y="0" width="${w}%" height="26" fill="${cores[id] || cores.outros}"><title>${rotuloModalidade(id)} · ${brl(x2.v)}</title></rect>`;
    leg += `<span><i style="background:${cores[id] || cores.outros}"></i>${rotuloModalidade(id)} · ${brl(x2.v)} (${x2.n})</span>`;
    x += w;
  });
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none" style="height:26px" role="img"
    aria-label="Composição das saídas">${barra}</svg><div class="legenda-g">${leg}</div>`;
}

/* Evolução entre competências. Com uma só, mostra o aviso de que liga na
   próxima carga — a estrutura já está pronta para receber. */
function graficoEvolucao() {
  const comps = BASE.competencias.slice().sort();
  const pontos = comps.map(cp => {
    let e = 0, s = 0, sa = 0;
    contasVisiveis().forEach(c => {
      const a = analisar(c, cp);
      if (!a) return;
      const t = somar(a.lancamentos);
      e += t.cashIn; s += t.cashOut; sa += a.saldoDeclarado;
    });
    return {cp, e, s, sa};
  }).filter(p => p.e || p.s);

  if (pontos.length < 2) {
    return `<div class="g-vazio">A evolução mês a mês aparece aqui quando a segunda competência
      entrar. Hoje o painel tem ${pontos.length} competência com movimento.</div>`;
  }

  const W = 720, H = 200, pad = {t: 12, r: 8, b: 22, l: 8};
  const max = Math.max(...pontos.map(p => Math.max(p.e, p.s, p.sa))) || 1;
  const px = i => pad.l + (i * (W - pad.l - pad.r)) / Math.max(1, pontos.length - 1);
  const py = v => pad.t + (1 - v / max) * (H - pad.t - pad.b);
  const linha = (campo, cor) => {
    const d = pontos.map((p, i) => `${i ? "L" : "M"}${px(i).toFixed(1)},${py(p[campo]).toFixed(1)}`).join(" ");
    const pts = pontos.map((p, i) =>
      `<circle cx="${px(i).toFixed(1)}" cy="${py(p[campo]).toFixed(1)}" r="3" fill="${cor}"><title>${rotuloComp(p.cp)} · ${brl(p[campo])}</title></circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round"/>${pts}`;
  };
  const rot = pontos.map((p, i) =>
    `<text x="${px(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${rotuloComp(p.cp)}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução por competência">
    ${linha("e", "var(--in)")}${linha("s", "var(--out)")}${linha("sa", "var(--asm-vinho)")}${rot}
  </svg>
  <div class="legenda-g">
    <span><i style="background:var(--in)"></i>Cash in</span>
    <span><i style="background:var(--out)"></i>Cash out</span>
    <span><i style="background:var(--asm-vinho)"></i>Saldo</span>
  </div>`;
}

/* Resumo de uma conta com a janela de datas do filtro geral já aplicada.
   Sem janela, o saldo é o declarado no extrato; com janela, é o saldo do
   último lançamento do recorte — a conciliação em si continua sendo do mês
   inteiro, porque é assim que o extrato fecha. */
function resumoConta(c) {
  const a = analisar(c, comp);
  if (!a) return {conta:c, a:null, lanc:[], entradas:0, saidas:0, tarifaQtd:0,
                  tarifaTotal:0, saldo:null, alertas:[], janela:false};
  const janela = !!(fGeral.de || fGeral.ate);
  const lanc = janela ? a.lancamentos.filter(l => dentroDoPeriodo(l, fGeral.de, fGeral.ate)) : a.lancamentos;
  const s = somar(lanc);
  /* taxa de entrada acompanha o recorte de datas; o ciclo de estorno é sempre
     do mês fechado, porque depende de ver a tentativa e o reenvio juntos. */

  let maiorSaida = 0;
  lanc.forEach(l => {
    if (l.valor < 0 && !ehTarifa(l) && !ehTaxaEntrada(l)) maiorSaida = Math.max(maiorSaida, Math.abs(l.valor));
  });
  return {conta:c, a, lanc, ...s, alertas:a.alertas, janela,
          parados:a.ciclo.pendentes.length, valorParado:a.ciclo.valorParado,
          gruposEstorno:a.ciclo.grupos.length,
          semTarifaQtd:a.pareamento.semTarifa.length, tarifaDevida:a.pareamento.devido,
          orfas:a.pareamento.orfas.length, maiorSaida:+maiorSaida.toFixed(2),
          fecha: !a.parcial && Math.abs(a.difSaldo) < 0.01,
          graves:a.alertas.filter(x => x.nivel === "grave").length,
          saldo: janela ? (lanc.length ? lanc[lanc.length-1].saldo : null) : a.saldoDeclarado};
}

function geralFiltrado() {
  const termo = fGeral.busca;
  return contasVisiveis().map(resumoConta).filter(r => {
    const c = r.conta;
    if (!casaBusca(termo, c.apelido, c.conta, c.cnpj, c.titular, c.unidade, c.agencia)) return false;

    const temMov = r.lanc.length > 0;
    if (fGeral.movimento === "com" && !temMov) return false;
    if (fGeral.movimento === "sem" && temMov) return false;
    if (fGeral.movimento === "entradas" && r.entradas <= 0) return false;
    if (fGeral.movimento === "saidas" && r.saidas <= 0) return false;
    if (fGeral.movimento === "tarifas" && r.tarifaQtd === 0) return false;

    const graves = r.alertas.filter(x => x.nivel === "grave").length;
    if (fGeral.situacao === "sem-extrato" && r.a) return false;
    if (fGeral.situacao === "conciliadas" && (!r.a || graves)) return false;
    if (fGeral.situacao === "divergentes" && (!r.a || !graves)) return false;
    if (fGeral.situacao === "atencao" && (!r.a || !r.alertas.length)) return false;

    if (fGeral.ocorrencia !== "todas" && !r.alertas.some(x => x.tipo === fGeral.ocorrencia)) return false;
    return true;
  });
}

/* Datas de corte dos extratos da competência aberta. Quando os extratos não
   foram emitidos no mesmo dia, cada conta cobre um intervalo diferente — o
   que importa saber antes de comparar contas entre si. */
function cortesDaCompetencia(cp = comp) {
  const mapa = new Map();
  contasVisiveis().forEach(c => {
    const a = analisar(c, cp);
    if (!a) return;
    const m = a.periodo.match(/a\s*(\d{2}\/\d{2}\/\d{4})/);
    if (!m) return;
    mapa.set(m[1], (mapa.get(m[1]) || 0) + 1);
  });
  const ord = d => d.split("/").reverse().join("");
  return [...mapa.entries()].sort((a, b) => ord(a[0]) < ord(b[0]) ? -1 : 1);
}

function dataDeReferencia() {
  const c = cortesDaCompetencia();
  return c.length ? c[c.length - 1][0] : "";
}

/* Aviso a ser exibido quando as contas têm datas de corte diferentes. */
function avisoCortes() {
  const c = cortesDaCompetencia();
  if (c.length < 2) return "";
  const lista = c.map(([d, n]) => `<b>${n}</b> até ${d}`).join(", ");
  return `<div class="aviso"><b>Extratos com datas de corte diferentes.</b>
    Nesta competência, ${lista}. As contas com corte anterior ainda não
    mostram os últimos dias, então comparações entre contas ficam desiguais
    até a reemissão.</div>`;
}

  html += `<div class="tabela-wrap"><table>
